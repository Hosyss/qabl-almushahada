name: Temporary Cars live diagnostic

on:
  push:
    branches:
      - agent/p4-03-editorial-live-fix

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://qabl-almushahada.buildtools.workers.dev
      EDITORIAL_QID: Q182153
      EDITORIAL_QUERY: Cars
      EDITORIAL_ID: cars-2006-editorial-pilot-v1
    steps:
      - name: Inspect live Cars path
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 3 \
            --get --data-urlencode "q=$EDITORIAL_QUERY" \
            "$WORKER_URL/search" > "$RUNNER_TEMP/search.html"
          curl --fail --silent --show-error --location --retry 3 \
            "$WORKER_URL/title/$EDITORIAL_QID" > "$RUNNER_TEMP/title.html"
          curl --fail --silent --show-error --location --retry 3 \
            --get --data-urlencode "editorialId=$EDITORIAL_ID" \
            "$WORKER_URL/review" > "$RUNNER_TEMP/review.html"

          python - "$RUNNER_TEMP/search.html" "$RUNNER_TEMP/title.html" "$RUNNER_TEMP/review.html" <<'PY'
          import sys
          from pathlib import Path

          search = Path(sys.argv[1]).read_text(encoding='utf-8')
          title = Path(sys.argv[2]).read_text(encoding='utf-8')
          review = Path(sys.argv[3]).read_text(encoding='utf-8')

          groups = {
              'search': (search, ['تحليل تحريري جزئي', 'cars-2006-editorial-pilot-v1']),
              'title': (title, ['يوجد تحليل تحريري جزئي لهذا العمل', 'cars-2006-editorial-pilot-v1']),
              'review': (review, [
                  'تحليل تحريري موثق جزئيًا',
                  'insufficient_data',
                  'البيانات غير كافية للحكم',
                  '6/10',
                  'Common Sense Media',
                  'Plugged In',
                  'BBFC',
                  'Kids-In-Mind',
                  'Dove.org',
              ]),
          }

          failed = False
          for name, (html, terms) in groups.items():
              print(f'[{name}] length={len(html)}')
              for term in terms:
                  ok = term in html
                  print(f'  {"OK" if ok else "MISSING"}: {term}')
                  if not ok:
                      failed = True
              if 'المراجعة غير متاحة حاليًا' in html:
                  print('  REVIEW_UNAVAILABLE_PRESENT')
              if '<title>' in html:
                  start = html.find('<title>')
                  end = html.find('</title>', start)
                  print('  title-tag:', html[start:end+8])
          if failed:
              raise SystemExit(1)
          PY
