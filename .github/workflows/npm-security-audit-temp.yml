name: NPM security audit temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/npm-security-audit-2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Run full and production-only audits without modifying dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-prod.json" || true
          node --input-type=module - "$RUNNER_TEMP/audit-all.json" "$RUNNER_TEMP/audit-prod.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const [label, file] of [['ALL', process.argv[2]], ['PROD', process.argv[3]]]) {
            const payload = JSON.parse(readFileSync(file, 'utf8'));
            const meta = payload.metadata?.vulnerabilities ?? {};
            console.log(`${label}_COUNTS=${JSON.stringify(meta)}`);
            const rows = Object.entries(payload.vulnerabilities ?? {}).map(([name, v]) => ({
              name,
              severity: v.severity,
              direct: Boolean(v.isDirect),
              via: Array.isArray(v.via) ? v.via.map((x) => typeof x === 'string' ? x : x.title).filter(Boolean) : [],
              range: v.range,
              fixAvailable: v.fixAvailable,
            }));
            rows.sort((a,b) => a.name.localeCompare(b.name));
            console.log(`${label}_VULNERABILITIES=${JSON.stringify(rows)}`);
          }
          NODE
      - name: Upload exact audit JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-security-audit-json
          path: |
            ${{ runner.temp }}/audit-all.json
            ${{ runner.temp }}/audit-prod.json
          if-no-files-found: error
          retention-days: 3
