name: Checkpoint verification

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test tests/github-actions-supply-chain.test.mjs
      - run: npm run test:engine
      - run: node --experimental-strip-types --test tests/public-catalog-directory.test.ts
      - run: node --experimental-strip-types --test tests/editorial-persistence-immutability.test.ts tests/editorial-persistence-head-lock.test.ts
      - run: npm run test:migrations
      - run: npm run lint:local
      - run: npm run build:local
