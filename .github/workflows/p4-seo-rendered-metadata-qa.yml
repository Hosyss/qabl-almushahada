name: P4 SEO rendered metadata QA

on:
  pull_request:

jobs:
  rendered-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Start local app
        run: |
          npm run dev:local -- --host 127.0.0.1 --port 4173 > /tmp/p4-seo-vite.log 2>&1 &
          echo $! > /tmp/p4-seo-vite.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p4-seo-vite.log
          exit 1
      - name: Verify rendered crawler contract
        run: |
          node <<'NODE'
          const origin = 'https://qabl-almushahada.buildtools.workers.dev';
          const base = 'http://127.0.0.1:4173';
          const failures = [];

          async function text(path) {
            const response = await fetch(`${base}${path}`, { redirect: 'manual' });
            const body = await response.text();
            if (response.status < 200 || response.status >= 400) failures.push(`${path}: unexpected status ${response.status}`);
            return { response, body };
          }
          function has(html, pattern, label) {
            if (!pattern.test(html)) failures.push(label);
          }
          function lacks(html, pattern, label) {
            if (pattern.test(html)) failures.push(label);
          }

          const search = await text('/search?q=barbie&kind=movie&age=8');
          has(search.body, /<meta[^>]+name="robots"[^>]+content="[^"]*noindex[^"]*"/i, 'search: noindex meta missing');
          has(search.body, new RegExp(`<link[^>]+rel="canonical"[^>]+href="${origin.replaceAll('.', '\\.')}/search"`, 'i'), 'search: canonical missing or not collapsed');

          const invalidReview = await text('/review');
          has(invalidReview.body, /<meta[^>]+name="robots"[^>]+content="[^"]*noindex[^"]*"/i, 'invalid review: noindex meta missing');

          for (const path of ['/review-policy', '/corrections', '/privacy']) {
            const page = await text(path);
            has(page.body, new RegExp(`<link[^>]+rel="canonical"[^>]+href="${origin.replaceAll('.', '\\.')}${path}"`, 'i'), `${path}: self canonical missing`);
          }

          const robots = await text('/robots.txt');
          has(robots.body, /Disallow: \/internal/u, 'robots: internal disallow missing');
          has(robots.body, /Disallow: \/api\//u, 'robots: api disallow missing');
          has(robots.body, new RegExp(`Sitemap: ${origin.replaceAll('.', '\\.')}\/sitemap\\.xml`), 'robots: sitemap origin missing');

          const rootLayout = await (await fetch(`${base}/review-policy`)).text();
          lacks(rootLayout, /codex-preview|name="chatgpt"|name="openai"/i, 'public head leaked development/OpenAI metadata');

          console.log(JSON.stringify({ searchStatus: search.response.status, invalidReviewStatus: invalidReview.response.status, failures }, null, 2));
          if (failures.length) process.exit(1);
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/p4-seo-vite.log || true
