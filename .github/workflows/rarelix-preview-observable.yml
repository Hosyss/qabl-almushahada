name: RARELIX Pages observable noindex preview

on:
  push:
    branches:
      - rarelix-pages-preview-20260822
    paths:
      - ".github/workflows/rarelix-preview-observable.yml"
      - ".rarelix/payload/**"

permissions:
  contents: write

concurrency:
  group: rarelix-pages-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_PAGES_PROJECT: rarelix-preview
  EXPECTED_ARCHIVE_SHA256: f4e441d2e1707450331e84d88b584dfea3debd36912d312b425368430cacac12
  DEPLOY_STAGE: workflow_started

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out isolated preview branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Require existing Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing" >&2; exit 1; }
          echo "DEPLOY_STAGE=credentials_verified" >> "$GITHUB_ENV"

      - name: Reconstruct and verify RARELIX v3.9 preview
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rarelix-v39-pages.tar.xz"
          dist="$RUNNER_TEMP/rarelix-dist"
          cat .rarelix/payload/part*.b64 | base64 --decode > "$archive"
          echo "$EXPECTED_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$dist"
          tar -xJf "$archive" -C "$dist"

          rm -f \
            "$dist/assets/icon-192-opt.png" \
            "$dist/assets/icon-192-q.png" \
            "$dist/assets/icon-512-opt.png" \
            "$dist/assets/icon-512-q.png"

          test -f "$dist/index.html"
          test -f "$dist/_headers"
          test -f "$dist/robots.txt"
          test "$(find "$dist" -type f | wc -l | tr -d ' ')" -eq 56
          if grep -RInE 'icon-(192|512)-(opt|q)\.png' "$dist"; then
            echo "Removed icon variant is still referenced." >&2
            exit 1
          fi
          echo "DEPLOY_STAGE=payload_verified" >> "$GITHUB_ENV"

      - name: Verify preview remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/rarelix-dist"
          grep -Fqi 'X-Robots-Tag: noindex, nofollow, noarchive' "$dist/_headers"
          grep -Eq '^Disallow:[[:space:]]*/' "$dist/robots.txt"
          grep -Fq 'RARELIX' "$dist/index.html"
          if grep -RniE --binary-files=without-match 'buildtools|hosy|findza|findblaze' "$dist"; then
            echo "Reserved/internal naming leaked into public preview." >&2
            exit 1
          fi
          echo "DEPLOY_STAGE=safety_verified" >> "$GITHUB_ENV"

      - name: Resolve or create isolated Pages project
        shell: bash
        run: |
          set -euo pipefail
          project_json="$RUNNER_TEMP/pages-project.json"
          http_code="$(curl --silent --show-error \
            --output "$project_json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")"
          echo "PROJECT_HTTP_CODE=$http_code" >> "$GITHUB_ENV"

          if [[ "$http_code" == "404" ]]; then
            create_json="$RUNNER_TEMP/pages-project-create.json"
            create_code="$(curl --silent --show-error \
              --output "$create_json" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"name":"rarelix-preview","production_branch":"release"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
            echo "PROJECT_CREATE_HTTP_CODE=$create_code" >> "$GITHUB_ENV"
            if [[ "$create_code" != "200" && "$create_code" != "201" ]]; then
              cat "$create_json" >&2
              exit 1
            fi
          elif [[ "$http_code" != "200" ]]; then
            cat "$project_json" >&2
            exit 1
          fi
          echo "DEPLOY_STAGE=pages_project_ready" >> "$GITHUB_ENV"

      - name: Deploy noindex preview
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/rarelix-dist"
          set +e
          ./node_modules/.bin/wrangler pages deploy "$dist" \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=preview \
            2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
          wrangler_code="${PIPESTATUS[0]}"
          set -e
          echo "WRANGLER_EXIT_CODE=$wrangler_code" >> "$GITHUB_ENV"
          if [[ "$wrangler_code" != "0" ]]; then
            exit "$wrangler_code"
          fi

          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | tail -n 1 || true)"
          test -n "$url" || { echo "Wrangler did not return a Pages URL." >&2; exit 1; }
          echo "RARELIX_PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "DEPLOY_STAGE=pages_deployed" >> "$GITHUB_ENV"

      - name: Smoke-test live preview
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 \
            --dump-header "$RUNNER_TEMP/live-headers.txt" \
            --output "$RUNNER_TEMP/live-home.html" \
            "$RARELIX_PREVIEW_URL/"
          grep -Fq 'RARELIX' "$RUNNER_TEMP/live-home.html"
          grep -Eqi '^x-robots-tag:.*noindex' "$RUNNER_TEMP/live-headers.txt"
          echo "DEPLOY_STAGE=live_smoke_verified" >> "$GITHUB_ENV"

          echo "### RARELIX live noindex preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $RARELIX_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public deployment files: 56" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live X-Robots-Tag noindex: verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish machine-readable outcome on temporary branch
        if: always()
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -u
          mkdir -p .rarelix
          {
            echo "status=$JOB_STATUS"
            echo "stage=${DEPLOY_STAGE:-unknown}"
            echo "source_sha=$SOURCE_SHA"
            echo "archive_sha256=$EXPECTED_ARCHIVE_SHA256"
            echo "public_files=56"
            echo "url=${RARELIX_PREVIEW_URL:-}"
            echo "project_http=${PROJECT_HTTP_CODE:-}"
            echo "project_create_http=${PROJECT_CREATE_HTTP_CODE:-}"
            echo "wrangler_exit=${WRANGLER_EXIT_CODE:-}"
          } > .rarelix/LIVE_PREVIEW_RESULT.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .rarelix/LIVE_PREVIEW_RESULT.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record isolated RARELIX preview outcome"
          git push origin HEAD:rarelix-pages-preview-20260822
