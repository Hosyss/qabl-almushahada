# Temporary probe; remove before clean remediation head.
name: Runtime security remediation probe

on:
  push:
    branches:
      - agent/runtime-security-remediation-2026-08-18
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22.13
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Generate stable Next.js 16.3.0 lockfile candidate
        run: |
          npm pkg set dependencies.next=16.3.0
          npm install --package-lock-only --ignore-scripts

      - name: Install exact candidate graph
        run: npm ci

      - name: Record runtime dependency graph
        run: npm ls next nanoid postcss sharp --all > runtime-dependency-graph.txt || true

      - name: Audit production dependency graph
        run: npm audit --omit=dev --json > runtime-audit.json || true

      - name: Require zero production vulnerabilities
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const audit = JSON.parse(readFileSync('runtime-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('Production audit:', counts);
          if ((counts.total ?? 0) !== 0) {
            console.error('Production dependency graph is not clean.');
            process.exit(1);
          }
          NODE

      - name: Engine tests
        run: npm run test:engine

      - name: Migration verification
        run: npm run test:migrations

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Cloudflare production-shape build rehearsal
        env:
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_D1_DATABASE_NAME: qabl-runtime-remediation-rehearsal
          CF_WORKER_NAME: qabl-remediation-rehearsal
        run: npm run cloudflare:build

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-security-remediation-candidate
          path: |
            package.json
            package-lock.json
            runtime-audit.json
            runtime-dependency-graph.txt
          if-no-files-found: error

      - name: Report probe run to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const body = `runtime-remediation-probe run ${process.env.RUN_ID}: ${process.env.JOB_STATUS}`;
          const response = await fetch(`https://api.github.com/repos/${repository}/issues/102/comments`, {
            method: 'POST',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({ body }),
          });
          if (!response.ok) {
            console.error(`Failed to post PR comment: ${response.status} ${await response.text()}`);
            process.exit(1);
          }
          console.log(body);
          NODE
