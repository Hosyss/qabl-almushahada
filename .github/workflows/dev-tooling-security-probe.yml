# Temporary vinext CSS/output parity probe; remove before clean head.
name: Dev tooling security remediation probe

on:
  pull_request:
    branches:
      - agent/runtime-security-remediation-2026-08-18

permissions:
  contents: read

jobs:
  css-parity:
    strategy:
      fail-fast: false
      matrix:
        variant: [vinext-baseline, vinext-beta]
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22.13
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install baseline graph
        run: npm ci

      - name: Apply common hardened graph
        run: |
          npm pkg set \
            dependencies.react=19.2.8 \
            dependencies.react-dom=19.2.8 \
            devDependencies.react-server-dom-webpack=19.2.8 \
            devDependencies.@cloudflare/vite-plugin=1.53.0 \
            devDependencies.wrangler=4.124.0 \
            devDependencies.vite=8.2.1
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json','utf8')); p.overrides={...(p.overrides??{}),'@esbuild-kit/core-utils':{esbuild:'0.25.12'}}; writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');"
          npm install --package-lock-only --ignore-scripts
          npm update @babel/core brace-expansion fast-uri js-yaml --package-lock-only --ignore-scripts

      - name: Select vinext variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$VARIANT" == "vinext-baseline" ]]; then
            npm pkg set devDependencies.vinext=0.0.50 devDependencies.@vitejs/plugin-rsc=0.5.26
          else
            npm pkg set devDependencies.vinext=1.0.0-beta.6 devDependencies.@vitejs/plugin-rsc=0.5.34
          fi
          npm install --package-lock-only --ignore-scripts

      - name: Install exact candidate graph
        run: npm ci

      - name: Build and capture warnings
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          grep -n 'FILE_NAME_CONFLICT\|unsupported by `configLoader' build.log > build-warning-focus.txt || true
          cat build-warning-focus.txt

      - name: Record final CSS bytes and references
        run: |
          find dist -type f -name '*.css' -print0 | sort -z | xargs -0 sha256sum > css-sha256.txt
          find dist -type f -name '*.css' -printf '%P\t%s bytes\n' | sort > css-files.txt
          grep -RahoE '_next/static/css/[A-Za-z0-9._-]+\.css' dist | sort -u > css-references.txt || true
          wc -l css-sha256.txt css-references.txt
          cat css-sha256.txt
          cat css-references.txt

      - name: Rendered HTML regression
        run: node --test tests/rendered-html.test.mjs

      - name: Upload exact build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vinext-css-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            build.log
            build-warning-focus.txt
            css-sha256.txt
            css-files.txt
            css-references.txt
            dist
            package.json
            package-lock.json
          if-no-files-found: error
