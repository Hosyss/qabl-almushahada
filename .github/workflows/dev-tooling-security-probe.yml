# Temporary one-shot dev/build tooling remediation gate; remove after verified manifest commit.
name: Dev tooling security remediation probe

on:
  pull_request:
    branches:
      - agent/runtime-security-remediation-2026-08-18

permissions:
  contents: write

jobs:
  final-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/dev-tooling-security-remediation-2026-08-19

      - name: Set up Node 22.13
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install baseline graph
        run: npm ci

      - name: Apply exact final candidate
        run: |
          npm pkg set \
            dependencies.react=19.2.8 \
            dependencies.react-dom=19.2.8 \
            devDependencies.react-server-dom-webpack=19.2.8 \
            devDependencies.@cloudflare/vite-plugin=1.53.0 \
            devDependencies.wrangler=4.124.0 \
            devDependencies.vite=8.2.1 \
            devDependencies.vinext=1.0.0-beta.6 \
            devDependencies.@vitejs/plugin-rsc=0.5.34
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json','utf8')); p.overrides={...(p.overrides??{}),'@esbuild-kit/core-utils':{esbuild:'0.25.12'}}; writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');"
          npm install --package-lock-only --ignore-scripts
          npm update @babel/core brace-expansion fast-uri js-yaml esbuild --package-lock-only --ignore-scripts

      - name: Install exact candidate graph
        run: npm ci

      - name: Assert full and production audits are clean
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-prod.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const file of ['audit-full.json', 'audit-prod.json']) {
            const audit = JSON.parse(readFileSync(file, 'utf8'));
            const counts = audit.metadata?.vulnerabilities ?? {};
            console.log(file, counts);
            if ((counts.total ?? 0) !== 0) {
              console.error(`${file} is not clean.`);
              process.exit(1);
            }
          }
          NODE

      - name: Record exact security-relevant dependency graph
        run: npm ls react react-dom react-server-dom-webpack @cloudflare/vite-plugin wrangler vite vinext @vitejs/plugin-rsc image-size drizzle-kit @esbuild-kit/esm-loader @esbuild-kit/core-utils esbuild @babel/core brace-expansion fast-uri js-yaml --all > dependency-graph.txt

      - name: Engine regression gate
        run: npm run test:engine

      - name: Migration regression gate
        run: npm run test:migrations

      - name: Lint gate
        run: npm run lint

      - name: Verified production build and capture warnings
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Enforce CSS collision integrity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs';
          import path from 'node:path';

          const buildLog = readFileSync('build.log', 'utf8');
          const conflictPattern = /The emitted file\s+"?([^"\s]+\.css)"?\s+overwrites a previously emitted file of the same name\./g;
          const conflictPaths = [...buildLog.matchAll(conflictPattern)].map((m) => m[1]);
          const uniqueConflicts = [...new Set(conflictPaths)].sort();
          const expectedKinds = ['internal', 'title-artwork'];
          const conflictKinds = uniqueConflicts.map((p) => path.basename(p).split('.')[0]).sort();

          const walk = (root) => {
            const out = [];
            for (const name of readdirSync(root)) {
              const p = path.join(root, name);
              if (statSync(p).isDirectory()) out.push(...walk(p)); else out.push(p);
            }
            return out;
          };
          const distFiles = walk('dist');
          const textFiles = distFiles.filter((p) => !p.endsWith('.css')).map((p) => {
            try { return [p, readFileSync(p, 'utf8')]; } catch { return [p, '']; }
          });

          const sourceSpecs = [
            ['internal', 'app/internal/internal.module.css'],
            ['title-artwork', 'app/title-artwork.module.css'],
          ];
          const reports = [];
          for (const [kind, sourcePath] of sourceSpecs) {
            const source = readFileSync(sourcePath, 'utf8');
            const sourceClasses = [...new Set([...source.matchAll(/\.([A-Za-z_][A-Za-z0-9_-]*)/g)].map((m) => m[1]))].sort();
            const conflict = uniqueConflicts.find((p) => path.basename(p).startsWith(`${kind}.`));
            const clientPath = conflict ? path.join('dist/client', conflict) : null;
            let css = '';
            let exists = false;
            if (clientPath) {
              try { css = readFileSync(clientPath, 'utf8'); exists = true; } catch {}
            }
            const missingClassNames = sourceClasses.filter((name) => {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return !new RegExp(`\\._${escaped}_[A-Za-z0-9_-]+`).test(css);
            });
            const referencedBy = conflict ? textFiles.filter(([, text]) => text.includes(conflict)).map(([p]) => p) : [];
            reports.push({ kind, sourcePath, sourceClasses, conflict, clientPath, exists, missingClassNames, referencedBy });
          }

          const report = {
            uniqueConflicts,
            conflictKinds,
            expectedKinds,
            unexpectedConflictLines: buildLog.split(/\r?\n/).filter((line) => line.includes('FILE_NAME_CONFLICT') && !line.includes('internal.') && !line.includes('title-artwork.')),
            reports,
          };
          writeFileSync('css-integrity-report.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));

          if (JSON.stringify(conflictKinds) !== JSON.stringify(expectedKinds)) process.exit(1);
          if (report.unexpectedConflictLines.length) process.exit(1);
          for (const item of reports) {
            if (!item.exists || item.referencedBy.length === 0 || item.missingClassNames.length !== 0) process.exit(1);
          }
          NODE

      - name: Cloudflare production-shape build rehearsal
        env:
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_D1_DATABASE_NAME: qabl-dev-tooling-rehearsal
          CF_WORKER_NAME: qabl-dev-tooling-rehearsal
        run: npm run cloudflare:build

      - name: Upload exact final candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-tooling-final-candidate-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            audit-full.json
            audit-prod.json
            dependency-graph.txt
            build.log
            css-integrity-report.json
          if-no-files-found: warn

      - name: Commit only verified dependency manifests
        run: |
          git add package.json package-lock.json
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "package-lock.json package.json "
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remediate dev and build tooling vulnerabilities"
          git push origin HEAD:agent/dev-tooling-security-remediation-2026-08-19
