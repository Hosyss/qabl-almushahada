# Temporary dev/build tooling remediation probe; remove before clean head.
name: Dev tooling security remediation probe

on:
  pull_request:
    branches:
      - agent/runtime-security-remediation-2026-08-18

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [vinext-compatible, drizzle-override, combined]
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22.13
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install baseline graph
        run: npm ci

      - name: Apply proven non-major candidate
        run: |
          npm pkg set \
            dependencies.react=19.2.8 \
            dependencies.react-dom=19.2.8 \
            devDependencies.react-server-dom-webpack=19.2.8 \
            devDependencies.@cloudflare/vite-plugin=1.53.0 \
            devDependencies.wrangler=4.124.0 \
            devDependencies.vite=8.2.1
          npm install --package-lock-only --ignore-scripts
          npm update @babel/core brace-expansion fast-uri js-yaml --package-lock-only --ignore-scripts

      - name: Apply isolated residual candidate
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ "$VARIANT" == "vinext-compatible" || "$VARIANT" == "combined" ]]; then
            npm pkg set devDependencies.vinext=1.0.0-beta.6 devDependencies.@vitejs/plugin-rsc=0.5.34
          fi
          if [[ "$VARIANT" == "drizzle-override" || "$VARIANT" == "combined" ]]; then
            node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json','utf8')); p.overrides={...(p.overrides??{}),'@esbuild-kit/core-utils':{esbuild:'0.25.12'}}; writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');"
          fi
          npm install --package-lock-only --ignore-scripts

      - name: Install exact candidate graph
        run: npm ci

      - name: Measure full and production audits
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-prod.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const full = JSON.parse(readFileSync('audit-full.json', 'utf8'));
          const prod = JSON.parse(readFileSync('audit-prod.json', 'utf8'));
          console.log('Full audit:', full.metadata?.vulnerabilities ?? {});
          console.log('Production audit:', prod.metadata?.vulnerabilities ?? {});
          if ((prod.metadata?.vulnerabilities?.total ?? 0) !== 0) {
            console.error('Production dependency graph regressed.');
            process.exit(1);
          }
          NODE

      - name: Record residuals and exact versions
        run: |
          node --input-type=module <<'NODE' > residual.txt
          import { readFileSync } from 'node:fs';
          const audit = JSON.parse(readFileSync('audit-full.json', 'utf8'));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`${name}\t${item.severity}\tdirect=${item.isDirect}\trange=${item.range}\tfix=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE
          npm ls vinext image-size @vitejs/plugin-rsc drizzle-kit @esbuild-kit/esm-loader @esbuild-kit/core-utils esbuild --all >> residual.txt || true
          cat residual.txt

      - name: Engine tests
        run: npm run test:engine

      - name: Migration verification
        run: npm run test:migrations

      - name: Drizzle generation compatibility probe
        if: matrix.variant == 'drizzle-override' || matrix.variant == 'combined'
        run: |
          before="$(git status --porcelain -- drizzle drizzle.config.* 2>/dev/null || true)"
          npm run db:generate
          after="$(git status --porcelain -- drizzle drizzle.config.* 2>/dev/null || true)"
          printf 'Before generation:\n%s\nAfter generation:\n%s\n' "$before" "$after"
          test "$after" = "$before"

      - name: Lint
        run: npm run lint

      - name: Verified production build
        run: npm run build

      - name: Cloudflare production-shape build rehearsal
        env:
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_D1_DATABASE_NAME: qabl-dev-tooling-rehearsal
          CF_WORKER_NAME: qabl-dev-tooling-rehearsal
        run: npm run cloudflare:build

      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-tooling-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            audit-full.json
            audit-prod.json
            residual.txt
          if-no-files-found: warn
