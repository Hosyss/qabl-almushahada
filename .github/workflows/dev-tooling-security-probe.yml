# Temporary Drizzle generation-parity probe; remove before clean head.
name: Dev tooling security remediation probe

on:
  pull_request:
    branches:
      - agent/runtime-security-remediation-2026-08-18

permissions:
  contents: read

jobs:
  generation-parity:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-generation, override-generation]
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22.13
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install baseline graph
        run: npm ci

      - name: Apply common hardened candidate
        run: |
          npm pkg set \
            dependencies.react=19.2.8 \
            dependencies.react-dom=19.2.8 \
            devDependencies.react-server-dom-webpack=19.2.8 \
            devDependencies.@cloudflare/vite-plugin=1.53.0 \
            devDependencies.wrangler=4.124.0 \
            devDependencies.vite=8.2.1 \
            devDependencies.vinext=1.0.0-beta.6 \
            devDependencies.@vitejs/plugin-rsc=0.5.34
          npm install --package-lock-only --ignore-scripts
          npm update @babel/core brace-expansion fast-uri js-yaml --package-lock-only --ignore-scripts

      - name: Apply scoped esbuild override only in override variant
        if: matrix.variant == 'override-generation'
        run: |
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json','utf8')); p.overrides={...(p.overrides??{}),'@esbuild-kit/core-utils':{esbuild:'0.25.12'}}; writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');"
          npm install --package-lock-only --ignore-scripts

      - name: Install exact candidate graph
        run: npm ci

      - name: Generate Drizzle migration output
        run: |
          npm run db:generate
          git status --porcelain -- drizzle drizzle.config.* > generation-status.txt || true
          find drizzle -type f -print0 | sort -z | xargs -0 sha256sum > generation-sha256.txt
          cat generation-status.txt
          cat generation-sha256.txt

      - name: Upload complete generated Drizzle tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drizzle-generation-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            drizzle
            generation-status.txt
            generation-sha256.txt
            package.json
            package-lock.json
          if-no-files-found: error
