name: RARELIX isolated Pages preview runner

on:
  push:
    branches:
      - rarelix-pages-preview-20260822
    paths:
      - ".github/workflows/rarelix-preview-runner.yml"
      - ".rarelix/deploy-preview.sh"
      - ".rarelix/payload/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rarelix-preview-runner.yml"
      - ".rarelix/deploy-preview.sh"
      - ".rarelix/payload/**"

permissions:
  contents: write

concurrency:
  group: rarelix-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.RARELIX_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Deploy and smoke-test RARELIX preview
        id: deploy
        shell: bash
        run: bash .rarelix/deploy-preview.sh

      - name: Record outcome on temporary branch
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          test -f .rarelix/LIVE_PREVIEW_RESULT.txt || {
            printf '%s\n' 'status=failure' 'stage=runner_failed_before_script_result' 'url=' > .rarelix/LIVE_PREVIEW_RESULT.txt
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .rarelix/LIVE_PREVIEW_RESULT.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record isolated RARELIX preview outcome"
          git push origin HEAD:rarelix-pages-preview-20260822
