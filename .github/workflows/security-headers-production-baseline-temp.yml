name: Security headers production baseline temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current Production response headers
        shell: bash
        env:
          ORIGIN: https://qabl-almushahada.buildtools.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --location --head "$ORIGIN/" > "$RUNNER_TEMP/home.headers"
          curl --silent --show-error --location --head "$ORIGIN/api/search?q=nemo" > "$RUNNER_TEMP/api.headers" || true
          echo '--- HOME ---'
          cat "$RUNNER_TEMP/home.headers"
          echo '--- API ---'
          cat "$RUNNER_TEMP/api.headers"

          node --input-type=module - "$RUNNER_TEMP/home.headers" <<'NODE'
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8').toLowerCase();
          const names = [
            'x-content-type-options',
            'referrer-policy',
            'content-security-policy',
            'x-frame-options',
          ];
          const result = Object.fromEntries(names.map((name) => [name, text.includes(`${name}:`)]));
          console.log(`SECURITY_HEADER_BASELINE=${JSON.stringify(result)}`);
          NODE
