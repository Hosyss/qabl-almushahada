name: Public report production secret bootstrap temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_WORKER_NAME: qabl-almushahada
  ORIGIN: https://qabl-almushahada.buildtools.workers.dev

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require existing Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Cloudflare repository credentials are unavailable; refusing to change Production.' >&2
            exit 1
          fi
          npx wrangler --version

      - name: Inspect secret names without exposing values
        id: secret_state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name "$CF_WORKER_NAME" --format json > "$RUNNER_TEMP/worker-secrets.json"
          if node --input-type=module - "$RUNNER_TEMP/worker-secrets.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const present = Array.isArray(payload) && payload.some((row) => row?.name === 'PUBLIC_REPORT_HMAC_SECRET');
          process.exit(present ? 0 : 1);
          NODE
          then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'PUBLIC_REPORT_HMAC_SECRET already exists; it will not be rotated.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'PUBLIC_REPORT_HMAC_SECRET is absent; a new value will be generated securely.'
          fi

      - name: Create production report secret once
        if: steps.secret_state.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(64).toString('base64url'));" \
            | npx wrangler secret put PUBLIC_REPORT_HMAC_SECRET --name "$CF_WORKER_NAME"

      - name: Verify secret name is now bound
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name "$CF_WORKER_NAME" --format json > "$RUNNER_TEMP/worker-secrets-after.json"
          node --input-type=module - "$RUNNER_TEMP/worker-secrets-after.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const present = Array.isArray(payload) && payload.some((row) => row?.name === 'PUBLIC_REPORT_HMAC_SECRET');
          if (!present) throw new Error('PUBLIC_REPORT_HMAC_SECRET is still absent after bootstrap.');
          console.log('Verified required public-report secret name is bound; value remains unreadable.');
          NODE

      - name: Verify real report path without creating a Production intake
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/report-readiness.json"
          status=''
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location \
              --output "$response" --write-out '%{http_code}' \
              --request POST "$ORIGIN/api/reports" \
              --header "Origin: $ORIGIN" \
              --header 'Content-Type: application/json' \
              --data '{"targetKind":"editorial_publication","targetId":"qa-missing-public-report-target-2026-08-18","reason":"source_issue","message":"فحص جاهزية آمن لمسار البلاغ الحقيقي باستخدام هدف غير موجود عمدًا، من دون إنشاء أي بلاغ إنتاجي."}')"
            if [[ "$status" == '404' ]]; then
              break
            fi
            if [[ "$status" == '503' || "$status" == '429' || "$status" =~ ^5 ]]; then
              sleep 3
              continue
            fi
            echo "Unexpected HTTP $status while checking the deliberately missing target." >&2
            cat "$response" >&2
            exit 1
          done

          echo "HTTP $status"
          cat "$response"
          if [[ "$status" != '404' ]]; then
            echo "Expected application-level 404 after secret deployment, got HTTP $status." >&2
            exit 1
          fi

          node --input-type=module - "$response" <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (payload?.accepted !== false) throw new Error('Expected accepted=false for deliberately missing target.');
          if (payload?.message !== 'المحتوى لم يعد متاحًا بهذه الحالة.') {
            throw new Error(`Unexpected application response: ${JSON.stringify(payload)}`);
          }
          NODE

          curl --fail --silent --show-error --location "$ORIGIN/" > /dev/null
          echo 'Production report path is HMAC-ready and the missing-target probe created no intake row.'

      - name: Record bootstrap evidence
        shell: bash
        run: |
          echo '### Public report Production secret ready' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: qabl-almushahada' >> "$GITHUB_STEP_SUMMARY"
          echo '- Secret value: generated in-process and never stored in Git or printed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Safe real-path probe: application-level 404 for a deliberately missing target' >> "$GITHUB_STEP_SUMMARY"
          echo '- PR #84 remains Draft; no merge performed' >> "$GITHUB_STEP_SUMMARY"
