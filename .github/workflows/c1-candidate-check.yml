name: C1 candidate check

on:
  push:
    branches:
      - agent/p4-03-c1-candidate-check

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify factual anchors in fixed Wikipedia revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          checks = {
              1369234653: ["fighting among themselves", "patriarchy", "submissive roles"],
              1369262629: ["severed arm", "pursue the children"],
              1368891540: ["long-term illness", "Mei's disappearance", "thinking that Mei has died"],
          }
          headers = {"User-Agent": "QablAlmushahada/1.0 (editorial evidence audit; contact via GitHub Hosyss/qabl-almushahada)"}
          for oldid, needles in checks.items():
              params = urllib.parse.urlencode({"action":"parse","oldid":str(oldid),"prop":"wikitext","format":"json"})
              req = urllib.request.Request("https://en.wikipedia.org/w/api.php?" + params, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  text = json.load(r)["parse"]["wikitext"]["*"]
              lowered = text.lower()
              missing = [needle for needle in needles if needle.lower() not in lowered]
              if missing:
                  raise SystemExit(f"oldid={oldid} missing expected factual anchors: {missing}")
              print(f"oldid={oldid}: factual anchors verified")
          PY
