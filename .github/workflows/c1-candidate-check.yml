name: C1 candidate check

on:
  push:
    branches:
      - agent/p4-03-c1-candidate-check

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve fixed Wikipedia revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          titles = ["Barbie (film)", "Jurassic Park", "My Neighbor Totoro"]
          headers = {"User-Agent": "QablAlmushahada/1.0 (editorial evidence audit; contact via GitHub Hosyss/qabl-almushahada)"}
          for title in titles:
              params = urllib.parse.urlencode({
                  "action":"query",
                  "prop":"revisions",
                  "rvprop":"ids|timestamp",
                  "rvlimit":"1",
                  "titles":title,
                  "format":"json",
              })
              req = urllib.request.Request("https://en.wikipedia.org/w/api.php?" + params, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              page = next(iter(data["query"]["pages"].values()))
              rev = page["revisions"][0]
              canonical = page["title"]
              slug = canonical.replace(" ", "_")
              print(f"{canonical}\toldid={rev['revid']}\t{rev['timestamp']}\thttps://en.wikipedia.org/w/index.php?title={urllib.parse.quote(slug)}&oldid={rev['revid']}")
          PY
