name: P4-02 mobile performance QA temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p4-02-mobile-performance-qa
  cancel-in-progress: true

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build:local

      - name: Prepare isolated local D1
        shell: bash
        run: |
          set -euo pipefail
          cat > .qa-wrangler.jsonc <<'JSON'
          {
            "name":"qabl-p4-02-local-qa",
            "main":"worker/index.ts",
            "compatibility_date":"2026-05-22",
            "compatibility_flags":["nodejs_compat"],
            "d1_databases":[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}]
          }
          JSON
          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do
            npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/dev/null
          done
          node --input-type=module <<'NODE' > /tmp/p4-02-qa-seed.sql
          import { createHash } from 'node:crypto';
          import { loadEditorialBootstrapFixtures } from './scripts/editorial-bootstrap-sql.mjs';
          const fixtures = await loadEditorialBootstrapFixtures();
          if (fixtures.length !== 10) throw new Error(`Expected exactly 10 fixtures, found ${fixtures.length}`);
          const q = value => `'${String(value).replaceAll("'", "''")}'`;
          for (const { review, presentation } of fixtures) {
            const qid = review.titleId.replace(/^wd:/u, '');
            const aliases = review.titleId === 'wd:Q102438' ? ["Harry Potter and the Sorcerer's Stone"] : [];
            console.log(`INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES (${q(review.titleId)},${q(presentation.titleAr)},${q(presentation.titleEn)},${q(review.kind)},${review.releaseYear},${q(JSON.stringify(aliases))});`);
            const hash = createHash('sha256').update(`local-p4-02-catalog:${qid}`).digest('hex');
            console.log(`INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES (${q(`qa-catalog-${qid}`)},${q(review.titleId)},'source-policy:wikidata:2026-08-13.1:catalog_metadata',${q(qid)},${q(`https://www.wikidata.org/wiki/${qid}`)},'2026-08-18T00:00:00Z',${q(hash)},'manual');`);
          }
          NODE
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/p4-02-qa-seed.sql >/dev/null
          node scripts/editorial-bootstrap-sql.mjs --out /tmp/editorial-bootstrap.sql
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/editorial-bootstrap.sql >/dev/null

      - name: Start isolated preview
        shell: bash
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          set -euo pipefail
          (npm run dev:local -- --host 127.0.0.1 --port 4173 >/tmp/p4-02-server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/p4-02-server.log
          exit 1

      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0

      - name: Verify slow-connection homepage request contract
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p qa-artifacts
          cat > .qa-p4-02.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const baseURL = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            locale: 'ar-EG',
          });
          const page = await context.newPage();
          const requests = [];
          page.on('request', (request) => requests.push(request.url()));

          const cdp = await context.newCDPSession(page);
          await cdp.send('Network.enable');
          await cdp.send('Network.setCacheDisabled', { cacheDisabled: true });
          await cdp.send('Network.emulateNetworkConditions', {
            offline: false,
            latency: 150,
            downloadThroughput: 200000,
            uploadThroughput: 93750,
            connectionType: 'cellular4g',
          });
          await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 });

          const response = await page.goto(`${baseURL}/`, { waitUntil: 'load', timeout: 60000 });
          if (!response?.ok()) throw new Error(`Homepage HTTP ${response?.status()}`);
          await page.waitForTimeout(1800);

          const dimensions = await page.evaluate(() => ({
            scrollWidth: document.documentElement.scrollWidth,
            innerWidth,
          }));
          if (dimensions.scrollWidth > dimensions.innerWidth + 1) {
            throw new Error(`Mobile horizontal overflow: ${dimensions.scrollWidth}/${dimensions.innerWidth}`);
          }

          const speculativeRsc = requests.filter((raw) => {
            const url = new URL(raw);
            if (!/\.rsc$/u.test(url.pathname)) return false;
            return [
              '/titles.rsc',
              '/review-policy.rsc',
              '/corrections.rsc',
              '/privacy.rsc',
              '/review.rsc',
            ].includes(url.pathname) || url.pathname.startsWith('/title/');
          });
          if (speculativeRsc.length > 0) {
            throw new Error(`Unexpected linked-route RSC prefetches: ${JSON.stringify(speculativeRsc)}`);
          }

          const beforeClick = requests.length;
          await Promise.all([
            page.waitForURL((url) => url.pathname === '/titles', { timeout: 30000 }),
            page.getByRole('link', { name: 'دليل العناوين' }).click(),
          ]);
          if (!page.url().endsWith('/titles')) throw new Error(`Navigation failed: ${page.url()}`);
          const clickRequests = requests.slice(beforeClick);
          const clickPaths = clickRequests.map((raw) => new URL(raw).pathname);
          const navigationTransport = clickPaths.includes('/titles.rsc')
            ? 'rsc'
            : clickPaths.includes('/titles')
              ? 'document'
              : null;
          if (!navigationTransport) {
            throw new Error(`No /titles request followed the click; requests: ${JSON.stringify(clickRequests)}`);
          }

          const report = {
            browser: await browser.version(),
            profile: {
              viewport: '390x844',
              deviceScaleFactor: 2,
              latencyMs: 150,
              downloadKbps: 1600,
              uploadKbps: 750,
              cpuSlowdown: 4,
              cacheDisabled: true,
            },
            homepage: {
              noHorizontalOverflow: true,
              linkedRouteRscBeforeClick: speculativeRsc,
              requestCountBeforeClick: beforeClick,
            },
            navigation: {
              titlesOpened: true,
              requestObservedAfterClick: true,
              transport: navigationTransport,
            },
            failures: [],
          };
          await fs.writeFile('qa-artifacts/report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: 'qa-artifacts/mobile-titles-after-click.png', fullPage: true });
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          NODE
          node .qa-p4-02.mjs

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-02-mobile-performance-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
