name: About page browser QA temporary

on:
  push:
    branches: [agent/public-about-page-2026-08-18]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci

      - name: Start local app
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:local -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/about-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/about-vite.pid"
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/about > "$RUNNER_TEMP/about.html"; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/about-vite.log" >&2
          exit 1

      - name: Verify rendered content and metadata
        shell: bash
        run: |
          set -euo pipefail
          html="$RUNNER_TEMP/about.html"
          grep -Fq 'كيف يساعدك' "$html"
          grep -Fq 'المجهول ليس' "$html"
          grep -Fq 'الموقع ليس خدمة بث' "$html"
          grep -Eq '<link[^>]+rel="canonical"[^>]+/about|<link[^>]+/about[^>]+rel="canonical"' "$html"
          if grep -Eqi 'noindex' "$html"; then
            echo 'About page unexpectedly rendered noindex.' >&2
            exit 1
          fi

      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1200 --screenshot="$RUNNER_TEMP/about-desktop.png" \
            http://127.0.0.1:4173/about
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 --screenshot="$RUNNER_TEMP/about-mobile.png" \
            http://127.0.0.1:4173/about

      - name: Check mobile document width
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --dump-dom \
            http://127.0.0.1:4173/about > "$RUNNER_TEMP/about-dom.html"
          grep -Fq 'عن الموقع' "$RUNNER_TEMP/about-dom.html"

      - uses: actions/upload-artifact@v4
        with:
          name: about-page-browser-qa
          path: |
            ${{ runner.temp }}/about-desktop.png
            ${{ runner.temp }}/about-mobile.png
            ${{ runner.temp }}/about.html
          if-no-files-found: error
          retention-days: 3
