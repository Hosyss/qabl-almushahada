name: C2B visual QA temporary

on:
  push:
    branches:
      - agent/p4-03c2a-asymmetric-decision

permissions:
  contents: read

concurrency:
  group: c2b-visual-qa-temporary
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:local

      - name: Prepare isolated local D1
        shell: bash
        run: |
          set -euo pipefail
          cat > .qa-wrangler.jsonc <<'JSON'
          {
            "name": "qabl-c2b-local-qa",
            "main": "worker/index.ts",
            "compatibility_date": "2026-05-22",
            "compatibility_flags": ["nodejs_compat"],
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "site-creator-d1",
                "database_id": "00000000-0000-4000-8000-000000000000"
              }
            ]
          }
          JSON

          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do
            npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/tmp/d1-migrate.log 2>&1 || {
              cat /tmp/d1-migrate.log
              exit 1
            }
          done

          node --input-type=module <<'NODE' > /tmp/c2b-qa-seed.sql
          import { createHash } from 'node:crypto';
          import { loadEditorialBootstrapFixtures } from './scripts/editorial-bootstrap-sql.mjs';
          const fixtures = await loadEditorialBootstrapFixtures();
          const q = value => `'${String(value).replaceAll("'", "''")}'`;
          for (const fixture of fixtures) {
            const { review, presentation } = fixture;
            const qid = review.titleId.replace(/^wd:/u, '');
            const aliases = review.titleId === 'wd:Q102438' ? ['HarryPotter', "Harry Potter and the Sorcerer's Stone"] : [];
            console.log(`INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES (${q(review.titleId)},${q(presentation.titleAr)},${q(presentation.titleEn)},${q(review.kind)},${review.releaseYear},${q(JSON.stringify(aliases))});`);
            const fixtureHash = createHash('sha256').update(`local-qa-catalog-fixture:${qid}`).digest('hex');
            console.log(`INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES (${q(`qa-catalog-${qid}`)},${q(review.titleId)},'source-policy:wikidata:2026-08-13.1:catalog_metadata',${q(qid)},${q(`https://www.wikidata.org/wiki/${qid}`)},'2026-08-14T00:00:00Z',${q(fixtureHash)},'manual');`);
          }
          NODE
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/c2b-qa-seed.sql
          node scripts/editorial-bootstrap-sql.mjs --out /tmp/editorial-bootstrap.sql
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/editorial-bootstrap.sql

      - name: Start isolated preview
        shell: bash
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          set -euo pipefail
          (npm run dev:local -- --port 4173 > /tmp/c2b-server.log 2>&1 & echo $! > /tmp/c2b-server.pid)
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/c2b-server.log
          exit 1

      - name: Install browser QA driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0

      - name: Run Chrome Desktop and Mobile QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is unavailable on runner.' >&2
            exit 1
          fi
          export CHROME
          mkdir -p qa-artifacts/screenshots
          cat > .qa-c2b-playwright.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const baseURL = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const seven = [
            ['Q182153','cars-2006-editorial-pilot-v1'],
            ['Q11621','et-1982-editorial-batch-v1'],
            ['Q102438','harry-potter-philosophers-stone-2001-editorial-batch-v1'],
            ['Q13619743','minions-2015-editorial-batch-v1'],
            ['Q55436290','barbie-2023-editorial-c1-v1'],
            ['Q167726','jurassic-park-1993-editorial-c1-v1'],
            ['Q39571','my-neighbor-totoro-1988-editorial-c1-v1'],
          ];
          const report = { browser: await browser.version(), checks: [], suggestions: null };

          async function inspect(route, viewport, name, screenshot = false) {
            const context = await browser.newContext({ viewport, locale: 'ar-EG' });
            const page = await context.newPage();
            const failedRequests = [];
            page.on('requestfailed', req => failedRequests.push({ url: req.url(), error: req.failure()?.errorText ?? 'failed' }));
            const response = await page.goto(baseURL + route, { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error(`${name}: HTTP ${response?.status()} for ${route}`);
            const data = await page.evaluate(() => {
              const images = [...document.images];
              const artwork = images.filter(img => (img.currentSrc || img.src).includes('/artwork/')).map(img => {
                const rect = img.getBoundingClientRect();
                const style = getComputedStyle(img);
                return {
                  src: new URL(img.currentSrc || img.src).pathname,
                  alt: img.alt,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  width: Math.round(rect.width),
                  height: Math.round(rect.height),
                  loading: img.loading,
                  objectFit: style.objectFit,
                  objectPosition: style.objectPosition,
                };
              });
              const overflow = document.documentElement.scrollWidth > innerWidth + 1;
              const offenders = [...document.querySelectorAll('body *')].filter(el => {
                const rect = el.getBoundingClientRect();
                return rect.right > innerWidth + 1 || rect.left < -1;
              }).slice(0, 20).map(el => ({ tag: el.tagName, className: String(el.className).slice(0, 100) }));
              return {
                route: location.pathname + location.search,
                dir: document.documentElement.dir,
                lang: document.documentElement.lang,
                viewport: { width: innerWidth, height: innerHeight },
                scrollWidth: document.documentElement.scrollWidth,
                overflow,
                offenders,
                brokenImages: images.filter(img => !img.complete || img.naturalWidth === 0).map(img => img.currentSrc || img.src),
                artwork,
                disclosureCount: document.body.innerText.split('غلاف توضيحي أصلي — ليس الملصق الرسمي').length - 1,
                focusableCount: document.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])').length,
              };
            });
            data.failedRequests = failedRequests;
            if (data.dir !== 'rtl') throw new Error(`${name}: document direction is ${data.dir}`);
            if (data.overflow) throw new Error(`${name}: horizontal overflow ${JSON.stringify(data.offenders)}`);
            if (data.brokenImages.length) throw new Error(`${name}: broken images ${JSON.stringify(data.brokenImages)}`);
            if (failedRequests.some(item => item.url.includes('/artwork/'))) throw new Error(`${name}: failed artwork requests ${JSON.stringify(failedRequests)}`);
            for (const art of data.artwork) {
              if (art.naturalWidth !== 720 || art.naturalHeight !== 960) throw new Error(`${name}: bad artwork intrinsic dimensions ${JSON.stringify(art)}`);
              if (art.objectFit !== 'cover') throw new Error(`${name}: artwork object-fit is not cover ${JSON.stringify(art)}`);
              if (!art.alt.trim()) throw new Error(`${name}: artwork alt text is empty`);
            }
            if (screenshot) await page.screenshot({ path: `qa-artifacts/screenshots/${name}.png`, fullPage: true });
            report.checks.push({ name, ...data });
            await context.close();
            return data;
          }

          const desktop = { width: 1440, height: 1000 };
          const mobile = { width: 390, height: 844 };
          const surfaces = [
            ['/', 'home'],
            ['/titles?editorialStatus=editorial', 'titles'],
            ['/search?q=Jurassic%20Park', 'search-jurassic'],
            ['/title/Q167726', 'title-jurassic'],
            ['/review?editorialId=jurassic-park-1993-editorial-c1-v1', 'review-jurassic'],
          ];
          for (const [route, name] of surfaces) {
            await inspect(route, desktop, `desktop-${name}`, true);
            await inspect(route, mobile, `mobile-${name}`, true);
          }

          for (const [qid, editorialId] of seven) {
            const title = await inspect(`/title/${qid}`, mobile, `mobile-title-${qid}`);
            if (title.artwork.length !== 1) throw new Error(`title ${qid}: expected one artwork, got ${title.artwork.length}`);
            const review = await inspect(`/review?editorialId=${encodeURIComponent(editorialId)}`, mobile, `mobile-review-${qid}`);
            if (review.artwork.length !== 1) throw new Error(`review ${qid}: expected one artwork, got ${review.artwork.length}`);
            if (review.disclosureCount < 1) throw new Error(`review ${qid}: missing original-artwork disclosure`);
          }

          const context = await browser.newContext({ viewport: mobile, locale: 'ar-EG' });
          const page = await context.newPage();
          await page.goto(baseURL + '/', { waitUntil: 'networkidle' });
          const combo = page.getByRole('combobox');
          await combo.fill('HarryPotter');
          const listbox = page.getByRole('listbox');
          await listbox.waitFor({ state: 'visible' });
          const options = listbox.getByRole('option');
          const optionCount = await options.count();
          if (optionCount < 1) throw new Error('suggestions: no options');
          const suggestionBroken = await listbox.locator('img').evaluateAll(imgs => imgs.filter(img => !img.complete || img.naturalWidth === 0).length);
          if (suggestionBroken) throw new Error('suggestions: broken artwork');
          const resourcesBefore = await page.evaluate(() => performance.getEntriesByType('resource').filter(r => r.initiatorType === 'img').map(r => new URL(r.name).pathname));
          await combo.press('ArrowDown');
          const activeDescendant = await combo.getAttribute('aria-activedescendant');
          if (!activeDescendant) throw new Error('suggestions: ArrowDown did not set aria-activedescendant');
          await combo.press('Escape');
          const expandedAfterEscape = await combo.getAttribute('aria-expanded');
          if (expandedAfterEscape !== 'false') throw new Error('suggestions: Escape did not close popup');
          report.suggestions = { optionCount, activeDescendant, expandedAfterEscape, imageResources: resourcesBefore };
          await page.screenshot({ path: 'qa-artifacts/screenshots/mobile-suggestions.png', fullPage: true });
          await context.close();

          await fs.writeFile('qa-artifacts/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({ checks: report.checks.length, suggestions: report.suggestions }, null, 2));
          await browser.close();
          NODE
          node .qa-c2b-playwright.mjs

      - name: Record QA summary
        if: always()
        shell: bash
        run: |
          echo '### C2B temporary visual QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- Branch-only local D1 preview; no Production D1 and no deploy.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f qa-artifacts/report.json ]; then
            node -e 'const r=require("./qa-artifacts/report.json"); console.log(`- Rendered checks: ${r.checks.length}`); console.log(`- Broken images: ${r.checks.reduce((n,c)=>n+c.brokenImages.length,0)}`); console.log(`- Horizontal overflow surfaces: ${r.checks.filter(c=>c.overflow).length}`); console.log(`- Suggestion options: ${r.suggestions?.optionCount ?? 0}`);' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- report.json was not produced; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2b-visual-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
