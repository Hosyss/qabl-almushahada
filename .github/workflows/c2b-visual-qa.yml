name: C2B visual QA temporary

on:
  push:
    branches: [agent/p4-03c2a-asymmetric-decision]

permissions:
  contents: read

concurrency:
  group: c2b-visual-qa-temporary
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build:local

      - name: Prepare isolated local D1
        shell: bash
        run: |
          set -euo pipefail
          cat > .qa-wrangler.jsonc <<'JSON'
          {
            "name":"qabl-c2b-local-qa",
            "main":"worker/index.ts",
            "compatibility_date":"2026-05-22",
            "compatibility_flags":["nodejs_compat"],
            "d1_databases":[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}]
          }
          JSON
          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do
            npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/dev/null
          done
          node --input-type=module <<'NODE' > /tmp/c2b-qa-seed.sql
          import { createHash } from 'node:crypto';
          import { loadEditorialBootstrapFixtures } from './scripts/editorial-bootstrap-sql.mjs';
          const fixtures = await loadEditorialBootstrapFixtures();
          const q = value => `'${String(value).replaceAll("'", "''")}'`;
          for (const { review, presentation } of fixtures) {
            const qid = review.titleId.replace(/^wd:/u, '');
            const aliases = review.titleId === 'wd:Q102438' ? ['HarryPotter', "Harry Potter and the Sorcerer's Stone"] : [];
            console.log(`INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES (${q(review.titleId)},${q(presentation.titleAr)},${q(presentation.titleEn)},${q(review.kind)},${review.releaseYear},${q(JSON.stringify(aliases))});`);
            const hash = createHash('sha256').update(`local-qa-catalog-fixture:${qid}`).digest('hex');
            console.log(`INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES (${q(`qa-catalog-${qid}`)},${q(review.titleId)},'source-policy:wikidata:2026-08-13.1:catalog_metadata',${q(qid)},${q(`https://www.wikidata.org/wiki/${qid}`)},'2026-08-14T00:00:00Z',${q(hash)},'manual');`);
          }
          NODE
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/c2b-qa-seed.sql >/dev/null
          node scripts/editorial-bootstrap-sql.mjs --out /tmp/editorial-bootstrap.sql
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/editorial-bootstrap.sql >/dev/null

      - name: Start isolated preview
        shell: bash
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          set -euo pipefail
          (npm run dev:local -- --port 4173 >/tmp/c2b-server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/c2b-server.log
          exit 1

      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0

      - name: Run real Chrome QA
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p qa-artifacts/screenshots
          cat > .qa-c2b-playwright.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const baseURL = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const seven = [
            ['Q182153','cars-2006-editorial-pilot-v1'],
            ['Q11621','et-1982-editorial-batch-v1'],
            ['Q102438','harry-potter-philosophers-stone-2001-editorial-batch-v1'],
            ['Q13619743','minions-2015-editorial-batch-v1'],
            ['Q55436290','barbie-2023-editorial-c1-v1'],
            ['Q167726','jurassic-park-1993-editorial-c1-v1'],
            ['Q39571','my-neighbor-totoro-1988-editorial-c1-v1'],
          ];
          const report = { browser: await browser.version(), checks: [], suggestions: null };
          const artworkResource = url => decodeURIComponent(url).includes('/artwork/');

          async function inspect(route, viewport, name, screenshot = false) {
            const context = await browser.newContext({ viewport, locale: 'ar-EG' });
            const page = await context.newPage();
            await page.addInitScript(() => {
              window.__qaCLS = 0;
              new PerformanceObserver(list => {
                for (const e of list.getEntries()) if (!e.hadRecentInput) window.__qaCLS += e.value;
              }).observe({ type: 'layout-shift', buffered: true });
            });
            const failedRequests = [];
            page.on('requestfailed', req => failedRequests.push({ url: req.url(), error: req.failure()?.errorText ?? 'failed' }));
            const response = await page.goto(baseURL + route, { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error(`${name}: HTTP ${response?.status()} for ${route}`);
            await page.waitForTimeout(250);

            const initial = await page.evaluate(() => ({
              cls: window.__qaCLS ?? 0,
              imageResources: performance.getEntriesByType('resource').filter(r => r.initiatorType === 'img').map(r => r.name),
              visibleBroken: [...document.images].filter(img => {
                const r = img.getBoundingClientRect();
                const nearViewport = r.bottom >= -200 && r.top <= innerHeight + 200;
                return nearViewport && (!img.complete || img.naturalWidth === 0);
              }).map(img => img.currentSrc || img.src),
            }));
            if (initial.visibleBroken.length) throw new Error(`${name}: visible broken images ${JSON.stringify(initial.visibleBroken)}`);
            if (initial.cls > 0.10) throw new Error(`${name}: initial CLS ${initial.cls}`);

            await page.evaluate(async () => {
              const step = Math.max(300, Math.floor(innerHeight * 0.75));
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                scrollTo(0, y);
                await new Promise(r => setTimeout(r, 120));
              }
              scrollTo(0, document.documentElement.scrollHeight);
              await new Promise(r => setTimeout(r, 250));
              scrollTo(0, 0);
            });
            await page.waitForTimeout(350);

            const data = await page.evaluate(() => {
              const images = [...document.images];
              const artwork = images.filter(img => decodeURIComponent(img.currentSrc || img.src).includes('/artwork/')).map(img => {
                const r = img.getBoundingClientRect();
                const s = getComputedStyle(img);
                return { src: img.currentSrc || img.src, alt: img.alt, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, width: Math.round(r.width), height: Math.round(r.height), loading: img.loading, objectFit: s.objectFit, objectPosition: s.objectPosition };
              });
              const overflow = document.documentElement.scrollWidth > innerWidth + 1;
              const offenders = [...document.querySelectorAll('body *')].filter(el => {
                const r = el.getBoundingClientRect();
                return r.right > innerWidth + 1 || r.left < -1;
              }).slice(0,20).map(el => ({ tag: el.tagName, className: String(el.className).slice(0,100) }));
              return {
                route: location.pathname + location.search,
                dir: document.documentElement.dir,
                lang: document.documentElement.lang,
                viewport: { width: innerWidth, height: innerHeight },
                scrollWidth: document.documentElement.scrollWidth,
                overflow,
                offenders,
                brokenImages: images.filter(img => !img.complete || img.naturalWidth === 0).map(img => img.currentSrc || img.src),
                artwork,
                disclosureCount: document.body.innerText.split('غلاف توضيحي أصلي — ليس الملصق الرسمي').length - 1,
                finalImageResources: performance.getEntriesByType('resource').filter(r => r.initiatorType === 'img').map(r => r.name),
              };
            });
            data.failedRequests = failedRequests;
            data.initialCLS = initial.cls;
            data.initialArtworkResources = initial.imageResources.filter(artworkResource);
            data.finalArtworkResources = data.finalImageResources.filter(artworkResource);

            if (data.dir !== 'rtl') throw new Error(`${name}: direction ${data.dir}`);
            if (data.overflow) throw new Error(`${name}: horizontal overflow ${JSON.stringify(data.offenders)}`);
            if (data.brokenImages.length) throw new Error(`${name}: broken after scroll ${JSON.stringify(data.brokenImages)}`);
            if (failedRequests.some(x => artworkResource(x.url))) throw new Error(`${name}: failed artwork request ${JSON.stringify(failedRequests)}`);
            for (const art of data.artwork) {
              const ratio = art.naturalWidth / art.naturalHeight;
              if (art.naturalWidth < 1 || art.naturalHeight < 1 || Math.abs(ratio - 0.75) > 0.02) throw new Error(`${name}: bad artwork ratio ${JSON.stringify(art)}`);
              if (art.objectFit !== 'cover') throw new Error(`${name}: object-fit ${art.objectFit}`);
              if (!art.alt.trim()) throw new Error(`${name}: empty artwork alt`);
            }
            if (screenshot) await page.screenshot({ path: `qa-artifacts/screenshots/${name}.png`, fullPage: true });
            report.checks.push({ name, ...data });
            await context.close();
            return data;
          }

          const desktop = { width: 1440, height: 1000 };
          const mobile = { width: 390, height: 844 };
          for (const [route,name] of [
            ['/','home'], ['/titles?editorialStatus=editorial','titles'], ['/search?q=Jurassic%20Park','search-jurassic'], ['/title/Q167726','title-jurassic'], ['/review?editorialId=jurassic-park-1993-editorial-c1-v1','review-jurassic']
          ]) {
            await inspect(route, desktop, `desktop-${name}`, true);
            await inspect(route, mobile, `mobile-${name}`, true);
          }
          for (const [qid, editorialId] of seven) {
            const title = await inspect(`/title/${qid}`, mobile, `mobile-title-${qid}`);
            if (title.artwork.length !== 1) throw new Error(`title ${qid}: artwork count ${title.artwork.length}`);
            const review = await inspect(`/review?editorialId=${encodeURIComponent(editorialId)}`, mobile, `mobile-review-${qid}`);
            if (review.artwork.length !== 1) throw new Error(`review ${qid}: artwork count ${review.artwork.length}`);
            if (review.disclosureCount < 1) throw new Error(`review ${qid}: missing artwork disclosure`);
          }

          const context = await browser.newContext({ viewport: mobile, locale: 'ar-EG' });
          const page = await context.newPage();
          await page.goto(baseURL + '/', { waitUntil: 'networkidle' });
          const beforeSearchResources = await page.evaluate(() => performance.getEntriesByType('resource').filter(r => r.initiatorType === 'img').map(r => r.name));
          const combo = page.getByRole('combobox');
          await combo.fill('HarryPotter');
          const listbox = page.getByRole('listbox');
          await listbox.waitFor({ state: 'visible' });
          const optionCount = await listbox.getByRole('option').count();
          if (optionCount < 1) throw new Error('suggestions: no options');
          const broken = await listbox.locator('img').evaluateAll(imgs => imgs.filter(img => !img.complete || img.naturalWidth === 0).length);
          if (broken) throw new Error('suggestions: broken artwork');
          await combo.press('ArrowDown');
          const activeDescendant = await combo.getAttribute('aria-activedescendant');
          if (!activeDescendant) throw new Error('suggestions: ArrowDown failed');
          await combo.press('Escape');
          const expandedAfterEscape = await combo.getAttribute('aria-expanded');
          if (expandedAfterEscape !== 'false') throw new Error('suggestions: Escape failed');
          const afterSearchResources = await page.evaluate(() => performance.getEntriesByType('resource').filter(r => r.initiatorType === 'img').map(r => r.name));
          report.suggestions = { optionCount, activeDescendant, expandedAfterEscape, beforeSearchResources, afterSearchResources };
          await page.screenshot({ path:'qa-artifacts/screenshots/mobile-suggestions.png', fullPage:true });
          await context.close();

          await fs.writeFile('qa-artifacts/report.json', JSON.stringify(report,null,2));
          console.log(JSON.stringify({ checks:report.checks.length, homeMobile:report.checks.find(x=>x.name==='mobile-home'), suggestions:report.suggestions },null,2));
          await browser.close();
          NODE
          node .qa-c2b-playwright.mjs

      - name: Summarize and upload QA evidence
        if: always()
        shell: bash
        run: |
          if [ -f qa-artifacts/report.json ]; then
            node -e 'const r=require("./qa-artifacts/report.json"); console.log(`checks=${r.checks.length}`); console.log(`broken=${r.checks.reduce((n,c)=>n+c.brokenImages.length,0)}`); console.log(`overflow=${r.checks.filter(c=>c.overflow).length}`); console.log(`maxCLS=${Math.max(...r.checks.map(c=>c.initialCLS)).toFixed(4)}`);' | tee qa-artifacts/summary.txt
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2b-visual-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
