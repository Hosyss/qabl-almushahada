name: P4-03C2 search diagnostic temporary
on:
  push:
    branches: [agent/p4-03c2-three-more-editorials]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Add temporary route error logging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/search-suggestions/route.ts')
          s=p.read_text()
          old='  } catch (error) {\n    if (error instanceof TypeError || error instanceof RangeError) {'
          new='  } catch (error) {\n    console.error("QA_SEARCH_ERROR", error);\n    if (error instanceof TypeError || error instanceof RangeError) {'
          if old not in s: raise SystemExit('catch block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Prepare isolated local D1
        shell: bash
        run: |
          set -euo pipefail
          cat > .qa-wrangler.jsonc <<'JSON'
          {"name":"qabl-search-diag","main":"worker/index.ts","compatibility_date":"2026-05-22","compatibility_flags":["nodejs_compat"],"d1_databases":[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}]}
          JSON
          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/dev/null; done
          cat > /tmp/seed.sql <<'SQL'
          INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES ('wd:Q68934496','الرجل العنكبوت: لا طريق للوطن','Spider-Man: No Way Home','movie',2021,'[]');
          INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES ('diag-q68934496','wd:Q68934496','source-policy:wikidata:2026-08-13.1:catalog_metadata','Q68934496','https://www.wikidata.org/wiki/Q68934496','2026-08-15T00:00:00Z','aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','manual');
          SQL
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/seed.sql >/dev/null
      - name: Reproduce and print server error
        shell: bash
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          set -euo pipefail
          (npm run dev:local -- --port 4173 >/tmp/search-diag-server.log 2>&1 &)
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          echo '--- short query ---'
          curl --silent --show-error --get --data-urlencode 'q=الرجل العنكبوت' http://127.0.0.1:4173/api/search-suggestions || true
          echo
          echo '--- full query ---'
          curl --silent --show-error --get --data-urlencode 'q=الرجل العنكبوت: لا طريق للوطن' http://127.0.0.1:4173/api/search-suggestions || true
          echo
          sleep 1
          echo '--- server log ---'
          cat /tmp/search-diag-server.log
