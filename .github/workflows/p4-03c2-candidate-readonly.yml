name: P4-03C2 candidate readonly

on:
  push:
    branches:
      - agent/p4-03c2-three-more-editorials

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_D1_DATABASE_NAME: qabl-almushahada-production

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read candidate titles from Production D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$CF_D1_DATABASE_NAME" --remote --command "SELECT id, canonical_name, original_name, release_year, kind, search_aliases_json FROM titles WHERE lower(canonical_name) IN ('frozen','inside out','finding nemo','the lion king','toy story','home alone','coco','moana','up','the incredibles','spirited away') OR lower(COALESCE(original_name,'')) IN ('frozen','inside out','finding nemo','the lion king','toy story','home alone','coco','moana','up','the incredibles','spirited away') ORDER BY release_year, canonical_name;" --json
