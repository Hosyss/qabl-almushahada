name: P4-03C2 candidate readonly

on:
  push:
    branches:
      - agent/p4-03c2-three-more-editorials

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_D1_DATABASE_NAME: qabl-almushahada-production

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Production D1 catalog
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$CF_D1_DATABASE_NAME" --remote --command "SELECT id, canonical_name, original_name, release_year, kind, search_aliases_json FROM titles ORDER BY release_year DESC, canonical_name LIMIT 250;" --json
