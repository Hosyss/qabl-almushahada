name: Editorial content-value audit temporary

on:
  push:
    branches: [agent/adsense-readiness-policy-2026-08-18]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Measure current editorial content
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/editorial-content-value.json"
          import { readdirSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const dir = path.join(process.cwd(), 'data', 'editorial-bootstrap');
          const rows = readdirSync(dir)
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => JSON.parse(readFileSync(path.join(dir, name), 'utf8')))
            .map(({ review, presentation }) => {
              const claimTexts = review.claims.map((claim) => claim.summaryAr.trim());
              const coreTexts = [review.scopeAr.trim(), review.analysisAr.trim(), ...claimTexts];
              const uniqueClaimCount = new Set(claimTexts).size;
              const coreChars = coreTexts.reduce((sum, text) => sum + [...text].length, 0);
              return {
                id: review.id,
                titleAr: presentation.titleAr,
                titleEn: presentation.titleEn,
                scopeChars: [...review.scopeAr.trim()].length,
                analysisChars: [...review.analysisAr.trim()].length,
                claimCount: review.claims.length,
                uniqueClaimCount,
                claimChars: claimTexts.reduce((sum, text) => sum + [...text].length, 0),
                coreChars,
                sourceCount: review.sources.length,
                uncertainCategoryCount: review.uncertainCategories.length,
              };
            });

          const exactDuplicateAnalyses = [];
          const exactDuplicateScopes = [];
          for (let i = 0; i < rows.length; i += 1) {
            const a = JSON.parse(readFileSync(path.join(dir, `${rows[i].id}.json`), 'utf8')).review;
            for (let j = i + 1; j < rows.length; j += 1) {
              const b = JSON.parse(readFileSync(path.join(dir, `${rows[j].id}.json`), 'utf8')).review;
              if (a.analysisAr.trim() === b.analysisAr.trim()) exactDuplicateAnalyses.push([a.id, b.id]);
              if (a.scopeAr.trim() === b.scopeAr.trim()) exactDuplicateScopes.push([a.id, b.id]);
            }
          }

          const output = {
            publicationCount: rows.length,
            exactDuplicateAnalyses,
            exactDuplicateScopes,
            minCoreChars: Math.min(...rows.map((row) => row.coreChars)),
            maxCoreChars: Math.max(...rows.map((row) => row.coreChars)),
            rows: rows.sort((a, b) => a.coreChars - b.coreChars),
          };
          console.log(JSON.stringify(output, null, 2));
          NODE
          cat "$RUNNER_TEMP/editorial-content-value.json"

      - name: Verify structural uniqueness only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/editorial-content-value.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (report.publicationCount !== 10) throw new Error(`Expected 10 current editorial publications, got ${report.publicationCount}.`);
          if (report.exactDuplicateAnalyses.length) throw new Error(`Exact duplicate analysis copy found: ${JSON.stringify(report.exactDuplicateAnalyses)}`);
          if (report.exactDuplicateScopes.length) throw new Error(`Exact duplicate scope copy found: ${JSON.stringify(report.exactDuplicateScopes)}`);
          for (const row of report.rows) {
            if (row.claimCount < 1 || row.uniqueClaimCount !== row.claimCount) {
              throw new Error(`Non-unique or empty claim set: ${row.id}`);
            }
          }
          console.log('All ten editorial publications have distinct scope/analysis copy and unique claim summaries.');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: editorial-content-value-audit
          path: ${{ runner.temp }}/editorial-content-value.json
          if-no-files-found: error
          retention-days: 3
