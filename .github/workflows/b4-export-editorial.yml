name: B4 editorial parity export

on:
  push:
    branches: ["agent/p4-03-b4-editorial-persistence"]
    paths:
      - "scripts/export-editorial-legacy.mts"
      - ".github/workflows/b4-export-editorial.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/export-editorial-legacy.mts > editorial-legacy.json
      - uses: actions/upload-artifact@v4
        with:
          name: b4-editorial-legacy
          path: editorial-legacy.json
          if-no-files-found: error
          retention-days: 7
