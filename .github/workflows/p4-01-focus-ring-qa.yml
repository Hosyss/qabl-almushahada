name: P4-01 focus ring QA temporary

on:
  push:
    branches: [agent/p4-01-accessibility]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Start local app
        run: |
          (npm run dev:local -- --host 127.0.0.1 --port 4173 >/tmp/a11y-qa-server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/search >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/a11y-qa-server.log
          exit 1
      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Verify keyboard focus contract in Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG', reducedMotion: 'reduce' });
          const page = await context.newPage();
          const response = await page.goto('http://127.0.0.1:4173/search', { waitUntil: 'networkidle' });
          if (!response?.ok()) throw new Error(`search HTTP ${response?.status()}`);
          await page.keyboard.press('Tab');
          const skip = page.locator('.skip-link');
          if (!(await skip.evaluate((el) => document.activeElement === el))) throw new Error('skip link is not first keyboard target');
          const skipStyle = await skip.evaluate((el) => ({ outline: getComputedStyle(el).outline, shadow: getComputedStyle(el).boxShadow, transform: getComputedStyle(el).transform }));
          if (!skipStyle.outline.includes('rgb(255, 255, 255)')) throw new Error(`white inner focus edge missing: ${skipStyle.outline}`);
          if (!skipStyle.shadow.includes('rgb(122, 45, 23)')) throw new Error(`dark outer focus edge missing: ${skipStyle.shadow}`);
          await page.keyboard.press('Enter');
          await page.waitForTimeout(50);
          const targetFocused = await page.evaluate(() => document.activeElement?.id === 'main-content' && location.hash === '#main-content');
          if (!targetFocused) throw new Error('skip link did not focus #main-content');
          const input = page.getByLabel('اسم الفيلم أو المسلسل', { exact: true });
          await input.focus();
          const inputStyle = await input.evaluate((el) => ({ outline: getComputedStyle(el).outline, shadow: getComputedStyle(el).boxShadow, transition: getComputedStyle(el).transitionDuration }));
          if (!inputStyle.outline.includes('rgb(255, 255, 255)')) throw new Error('input inner focus edge missing');
          if (!inputStyle.shadow.includes('rgb(122, 45, 23)')) throw new Error('input outer focus edge missing');
          const reduced = await page.evaluate(() => matchMedia('(prefers-reduced-motion: reduce)').matches);
          if (!reduced) throw new Error('reduced-motion emulation not active');
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 1);
          if (overflow) throw new Error('mobile horizontal overflow');
          console.log(JSON.stringify({ browser: await browser.version(), skipLink: true, dualToneFocus: true, reducedMotion: true, mobileOverflow: false }));
          await browser.close();
          NODE
