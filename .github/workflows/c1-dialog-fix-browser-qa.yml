name: C1 dialog fix browser QA temporary

on:
  push:
    branches: [fix/c1-editorial-dialog-focus-trap]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build:local
      - name: Prepare isolated local D1
        shell: bash
        run: |
          set -euo pipefail
          cat > .qa-wrangler.jsonc <<'JSON'
          {"name":"qabl-c1-dialog-local-qa","main":"worker/index.ts","compatibility_date":"2026-05-22","compatibility_flags":["nodejs_compat"],"d1_databases":[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}]}
          JSON
          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/dev/null; done
          node --input-type=module <<'NODE' > /tmp/c1-dialog-seed.sql
          import { createHash } from 'node:crypto';
          import { loadEditorialBootstrapFixtures } from './scripts/editorial-bootstrap-sql.mjs';
          const fixtures=await loadEditorialBootstrapFixtures();
          const q=v=>`'${String(v).replaceAll("'","''")}'`;
          for(const {review,presentation} of fixtures){const qid=review.titleId.replace(/^wd:/u,'');const aliases=review.titleId==='wd:Q102438'?['HarryPotter',"Harry Potter and the Sorcerer's Stone"]:[];console.log(`INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES (${q(review.titleId)},${q(presentation.titleAr)},${q(presentation.titleEn)},${q(review.kind)},${review.releaseYear},${q(JSON.stringify(aliases))});`);const hash=createHash('sha256').update(`local-qa-catalog-fixture:${qid}`).digest('hex');console.log(`INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES (${q(`qa-catalog-${qid}`)},${q(review.titleId)},'source-policy:wikidata:2026-08-13.1:catalog_metadata',${q(qid)},${q(`https://www.wikidata.org/wiki/${qid}`)},'2026-08-14T00:00:00Z',${q(hash)},'manual');`);}
          NODE
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/c1-dialog-seed.sql >/dev/null
          node scripts/editorial-bootstrap-sql.mjs --out /tmp/editorial-bootstrap.sql
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/editorial-bootstrap.sql >/dev/null
      - name: Start isolated preview
        shell: bash
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          set -euo pipefail
          (npm run dev:local -- --port 4173 >/tmp/c1-dialog-server.log 2>&1 &)
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/c1-dialog-server.log
          exit 1
      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Verify focus trap in Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p qa-artifacts/screenshots
          cat > .qa-dialog.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true});
          const base='http://127.0.0.1:4173';
          const titles=[['barbie','barbie-2023-editorial-c1-v1'],['jurassic','jurassic-park-1993-editorial-c1-v1'],['totoro','my-neighbor-totoro-1988-editorial-c1-v1']];
          const modes=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          const report=[];
          for(const [slug,id] of titles){for(const [mode,viewport] of modes){
            const context=await browser.newContext({viewport,locale:'ar-EG'});const page=await context.newPage();
            const response=await page.goto(`${base}/review?editorialId=${encodeURIComponent(id)}`,{waitUntil:'networkidle'});if(!response?.ok())throw new Error(`${mode}-${slug}: HTTP ${response?.status()}`);
            const opener=page.getByRole('button',{name:/اقرأ التحليل كاملًا/});await opener.click();const dialog=page.locator('dialog.editorial-summary-dialog');if(!(await dialog.evaluate(el=>el.open)))throw new Error(`${mode}-${slug}: dialog not open`);
            const forward=[];for(let i=0;i<16;i++){await page.keyboard.press('Tab');forward.push(await dialog.evaluate(el=>el.contains(document.activeElement)));}
            const reverse=[];for(let i=0;i<16;i++){await page.keyboard.press('Shift+Tab');reverse.push(await dialog.evaluate(el=>el.contains(document.activeElement)));}
            if(!forward.every(Boolean))throw new Error(`${mode}-${slug}: forward focus escaped ${JSON.stringify(forward)}`);
            if(!reverse.every(Boolean))throw new Error(`${mode}-${slug}: reverse focus escaped ${JSON.stringify(reverse)}`);
            await page.screenshot({path:`qa-artifacts/screenshots/${mode}-${slug}-dialog.png`,fullPage:true});
            await page.keyboard.press('Escape');await page.waitForTimeout(80);const closed=!(await dialog.evaluate(el=>el.open));const restored=await opener.evaluate(el=>document.activeElement===el);if(!closed||!restored)throw new Error(`${mode}-${slug}: close=${closed} restored=${restored}`);
            report.push({slug,mode,forward,reverse,closed,restored});await context.close();
          }}
          await fs.writeFile('qa-artifacts/report.json',JSON.stringify({browser:await browser.version(),checks:report},null,2));console.log(JSON.stringify({browser:await browser.version(),checks:report.length},null,2));await browser.close();
          NODE
          node .qa-dialog.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-dialog-fix-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
