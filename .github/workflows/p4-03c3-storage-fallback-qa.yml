name: P4-03C3 storage fallback QA temporary

on:
  push:
    branches: [agent/practical-editorial-verdict]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install and prepare local D1
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > .qa-wrangler.jsonc <<'JSON'
          {
            "name":"qabl-p4-03c3-storage-qa",
            "main":"worker/index.ts",
            "compatibility_date":"2026-05-22",
            "compatibility_flags":["nodejs_compat"],
            "d1_databases":[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}]
          }
          JSON
          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do
            npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/dev/null
          done
          node --input-type=module <<'NODE' > /tmp/qa-seed.sql
          import { createHash } from 'node:crypto';
          import { loadEditorialBootstrapFixtures } from './scripts/editorial-bootstrap-sql.mjs';
          const fixtures = await loadEditorialBootstrapFixtures();
          const q = value => `'${String(value).replaceAll("'", "''")}'`;
          for (const { review, presentation } of fixtures) {
            const qid = review.titleId.replace(/^wd:/u, '');
            const aliases = review.titleId === 'wd:Q102438' ? ["Harry Potter and the Sorcerer's Stone"] : [];
            console.log(`INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES (${q(review.titleId)},${q(presentation.titleAr)},${q(presentation.titleEn)},${q(review.kind)},${review.releaseYear},${q(JSON.stringify(aliases))});`);
            const hash = createHash('sha256').update(`storage-qa:${qid}`).digest('hex');
            console.log(`INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES (${q(`qa-catalog-${qid}`)},${q(review.titleId)},'source-policy:wikidata:2026-08-13.1:catalog_metadata',${q(qid)},${q(`https://www.wikidata.org/wiki/${qid}`)},'2026-08-18T00:00:00Z',${q(hash)},'manual');`);
          }
          NODE
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/qa-seed.sql >/dev/null
          node scripts/editorial-bootstrap-sql.mjs --out /tmp/editorial-bootstrap.sql
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/editorial-bootstrap.sql >/dev/null
      - name: Start isolated preview
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          (npm run dev:local -- --host 127.0.0.1 --port 4173 >/tmp/storage-qa-server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/storage-qa-server.log
          exit 1
      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Verify blocked localStorage fallback in Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG' });
          const page = await context.newPage();
          await page.addInitScript(() => {
            Object.defineProperty(window, 'localStorage', {
              configurable: true,
              get() { throw new DOMException('Blocked for QA', 'SecurityError'); },
            });
          });
          const response = await page.goto('http://127.0.0.1:4173/review?editorialId=et-1982-editorial-batch-v1', { waitUntil: 'networkidle' });
          if (!response?.ok()) throw new Error(`review HTTP ${response?.status()}`);
          const body = await page.locator('body').innerText();
          if (!body.includes('التخزين المحلي غير متاح حاليًا')) throw new Error('session-only disclosure missing');
          if (!body.includes('حدد عمر الطفل لإصدار الحكم')) throw new Error('family profile request missing');
          if (body.includes('ينفع للمشاهدة')) throw new Error('colloquial verdict copy leaked');
          await page.getByLabel('عمر الطفل', { exact: true }).selectOption('8');
          await page.getByLabel('حد الخوف', { exact: true }).selectOption('1');
          const bullying = page.getByRole('checkbox', { name: /تجنب التنمر بالكامل/u });
          if (await bullying.isChecked()) await bullying.uncheck();
          await page.getByRole('button', { name: /احفظ وحدث الحكم/u }).click();
          await page.waitForTimeout(100);
          const after = await page.locator('body').innerText();
          if (!after.includes('لهذه الجلسة فقط')) throw new Error('session save notice missing');
          if (!after.includes('لا أنصح به وفق حدود أسرتك')) throw new Error('verdict did not update with memory fallback');
          if (after.includes('ينفع للمشاهدة')) throw new Error('colloquial verdict copy leaked after save');
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 1);
          if (overflow) throw new Error('mobile horizontal overflow');
          console.log(JSON.stringify({ browser: await browser.version(), blockedLocalStorage: true, sessionFallback: true, verdictUpdated: true, formalArabic: true }));
          await browser.close();
          NODE
