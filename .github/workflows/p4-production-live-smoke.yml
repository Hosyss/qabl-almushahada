name: P4 production live smoke temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed P4 production behavior
        shell: bash
        env:
          ORIGIN: https://qabl-almushahada.buildtools.workers.dev
        run: |
          set -euo pipefail

          curl_get() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 "$@"
          }

          home="$RUNNER_TEMP/home.html"
          search="$RUNNER_TEMP/search.html"
          review="$RUNNER_TEMP/review.html"
          robots="$RUNNER_TEMP/robots.txt"
          report="$RUNNER_TEMP/report.json"

          curl_get "$ORIGIN/" > "$home"
          grep -Fq 'دليل عربي يساعدك على اتخاذ قرار قبل المشاهدة' "$home"
          grep -Fq 'rel="canonical"' "$home"
          grep -Fq "$ORIGIN/" "$home"

          curl_get "$ORIGIN/search?q=barbie&kind=movie&age=8" > "$search"
          grep -Fq 'noindex' "$search"
          grep -Fq "$ORIGIN/search" "$search"

          curl_get "$ORIGIN/robots.txt" > "$robots"
          grep -Fq 'Disallow: /internal' "$robots"
          grep -Fq 'Disallow: /api/' "$robots"

          curl_get "$ORIGIN/review?editorialId=et-1982-editorial-batch-v1" > "$review"
          grep -Fq 'حدد عمر الطفل لإصدار الحكم' "$review"
          if grep -Fq 'ينفع للمشاهدة' "$review"; then
            echo 'Colloquial practical-verdict copy leaked in production.' >&2
            exit 1
          fi

          status="$(curl --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output "$report" --write-out '%{http_code}' \
            --request POST "$ORIGIN/api/reports" \
            --header "Origin: $ORIGIN" \
            --header 'Content-Type: application/json' \
            --data '{"targetKind":"editorial_publication","targetId":"et-1982-editorial-batch-v1","reason":"missing_content","message":"فحص تلقائي غير مخزن لمسار honeypot بعد النشر.","website":"https://smoke.invalid"}')"

          if [[ "$status" != "202" ]]; then
            echo "Honeypot endpoint returned HTTP $status" >&2
            cat "$report" >&2 || true
            exit 1
          fi

          node --input-type=module - "$report" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [, , file] = process.argv;
          const payload = JSON.parse(readFileSync(file, 'utf8'));
          if (payload?.accepted !== true) throw new Error('Honeypot outward success missing');
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu.test(payload?.referenceId ?? '')) {
            throw new Error(`Honeypot reference is not a UUID: ${payload?.referenceId}`);
          }
          NODE

          echo 'Production live smoke passed: latest homepage/review copy, SEO indexing guards, robots rules, and non-persistent report honeypot are live.'

  remote-d1-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_NAME: qabl-almushahada-production
      CF_WORKER_NAME: qabl-almushahada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Resolve production D1 read-only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Cloudflare credentials are unavailable to the same-repository QA workflow.' >&2
            exit 1
          fi
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          DB_ID="$(node --input-type=module - "$RUNNER_TEMP/d1-list.json" "$CF_D1_DATABASE_NAME" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [, , file, wantedName] = process.argv;
          const rows = JSON.parse(readFileSync(file, 'utf8'));
          const matches = Array.isArray(rows) ? rows.filter((row) => row?.name === wantedName) : [];
          if (matches.length !== 1) throw new Error(`Expected exactly one D1 named ${wantedName}; found ${matches.length}`);
          const id = matches[0].uuid ?? matches[0].id ?? matches[0].database_id;
          if (typeof id !== 'string' || !/^[0-9a-fA-F-]{36}$/.test(id)) throw new Error('Resolved production D1 id is invalid');
          process.stdout.write(id);
          NODE
          )"
          echo "CF_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Verify remote public-report schema with SELECT only
        run: node scripts/verify-public-report-remote-schema.mjs
