name: C1 fingerprint helper

on:
  push:
    branches:
      - agent/p4-03-c1-three-editorials

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute new editorial fingerprints
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { buildEditorialPublicationFingerprint } from './lib/editorial-publication-integrity.ts';
          for (const name of [
            'barbie-2023-editorial-c1-v1.json',
            'jurassic-park-1993-editorial-c1-v1.json',
            'my-neighbor-totoro-1988-editorial-c1-v1.json',
          ]) {
            const fixture = JSON.parse(await readFile(`data/editorial-bootstrap/${name}`, 'utf8'));
            console.log(`${name}\t${await buildEditorialPublicationFingerprint(fixture.review, fixture.presentation)}`);
          }
          NODE
