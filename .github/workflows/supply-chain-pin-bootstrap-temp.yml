name: Supply-chain pin bootstrap temporary

on:
  push:
    branches: [agent/github-actions-sha-pinning-2026-08-18]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Pin external actions and add immutable-reference guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          replacements = {
              'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'actions/setup-node@v4': 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4',
          }

          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if '\npermissions:' not in text:
                  marker = '\njobs:\n'
                  if marker not in text:
                      raise SystemExit(f'Cannot place least-privilege permissions in {path}')
                  text = text.replace(marker, '\npermissions:\n  contents: read\n\njobs:\n', 1)
              path.write_text(text, encoding='utf-8')

          checkpoint = root / 'checkpoint.yml'
          text = checkpoint.read_text(encoding='utf-8')
          guard = '      - run: node --test tests/github-actions-supply-chain.test.mjs\n'
          if guard not in text:
              marker = '      - run: npm ci\n'
              if text.count(marker) != 1:
                  raise SystemExit('Checkpoint npm ci marker changed; refusing to guess.')
              text = text.replace(marker, marker + guard, 1)
              checkpoint.write_text(text, encoding='utf-8')

          test_path = Path('tests/github-actions-supply-chain.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readdir, readFile } from "node:fs/promises";\nimport path from "node:path";\nimport test from "node:test";\n\nconst WORKFLOWS = path.join(process.cwd(), ".github", "workflows");\nconst FULL_SHA = /^[0-9a-f]{40}$/iu;\n\ntest("every external GitHub Action is pinned to a full-length commit SHA", async () => {\n  const files = (await readdir(WORKFLOWS)).filter((name) => /\\.ya?ml$/u.test(name)).sort();\n  assert.ok(files.length > 0);\n\n  const seen = [];\n  for (const file of files) {\n    const text = await readFile(path.join(WORKFLOWS, file), "utf8");\n    for (const line of text.split(/\\r?\\n/u)) {\n      const match = line.match(/^\\s*-?\\s*uses:\\s*([^#\\s]+)/u);\n      if (!match) continue;\n      const reference = match[1];\n      if (reference.startsWith("./")) continue;\n      const at = reference.lastIndexOf("@");\n      assert.ok(at > 0, `${file} has an external action without a ref: ${reference}`);\n      const action = reference.slice(0, at);\n      const ref = reference.slice(at + 1);\n      assert.match(ref, FULL_SHA, `${file} must pin ${action} to a full 40-character commit SHA, not ${ref}`);\n      seen.push({ file, action, ref });\n    }\n  }\n\n  assert.ok(seen.some(({ action }) => action === "actions/checkout"));\n  assert.ok(seen.some(({ action }) => action === "actions/setup-node"));\n  assert.ok(seen.some(({ action }) => action === "actions/upload-artifact"));\n});\n\ntest("workflows explicitly keep the default GITHUB_TOKEN at read-only contents access", async () => {\n  const files = (await readdir(WORKFLOWS)).filter((name) => /\\.ya?ml$/u.test(name)).sort();\n  for (const file of files) {\n    const text = await readFile(path.join(WORKFLOWS, file), "utf8");\n    assert.match(text, /(?:^|\\n)permissions:\\s*\\n\\s{2}contents:\\s*read(?:\\n|$)/u, `${file} must declare read-only contents permission`);\n  }\n});\n''', encoding='utf-8')
          PY

          rm .github/workflows/supply-chain-pin-bootstrap-temp.yml

          git diff --check
          node --test tests/github-actions-supply-chain.test.mjs

          if grep -RInE 'uses:[[:space:]]+[^[:space:]#]+@(v[0-9]+|main|master|latest)([[:space:]#]|$)' .github/workflows; then
            echo 'Mutable GitHub Action reference remains after pinning.' >&2
            exit 1
          fi

      - name: Commit pinning changes to the same review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows tests/github-actions-supply-chain.test.mjs
          git commit -m 'Pin GitHub Actions to immutable commit SHAs'
          git push origin HEAD:agent/github-actions-sha-pinning-2026-08-18
