name: C1 three-title production QA temporary

on:
  push:
    branches: [agent/p4-03c2a-asymmetric-decision]

permissions:
  contents: read

concurrency:
  group: c1-three-production-qa-temporary
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6b7408c2f51d651f2445a0316b2fee3a5ac2421
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Run production Chrome QA
        shell: bash
        env:
          BASE_URL: https://qabl-almushahada.buildtools.workers.dev
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p qa-artifacts/screenshots
          cat > .qa-c1-production.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const baseURL = process.env.BASE_URL;
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const desktop = { width: 1440, height: 1000 };
          const mobile = { width: 390, height: 844 };
          const titles = [
            {slug:'barbie',qid:'Q55436290',editorialId:'barbie-2023-editorial-c1-v1',ar:'باربي',en:'Barbie',year:'2023',artwork:'barbie-2023.webp',wikipedia:'https://en.wikipedia.org/w/index.php?title=Barbie_%28film%29&oldid=1369234653',kim:'https://kids-in-mind.com/b/barbie-parents-guide-movie-review-rating.htm',queries:['باربي','Barbie','Barbie 2023','Barbi']},
            {slug:'jurassic',qid:'Q167726',editorialId:'jurassic-park-1993-editorial-c1-v1',ar:'الحديقة الجوارسية',en:'Jurassic Park',year:'1993',artwork:'jurassic-park-1993.webp',wikipedia:'https://en.wikipedia.org/w/index.php?title=Jurassic_Park&oldid=1369262629',kim:'https://kids-in-mind.com/j/jurassicpark.htm',queries:['الحديقة الجوارسية','Jurassic Park','JurassicPark','Jurasic Park']},
            {slug:'totoro',qid:'Q39571',editorialId:'my-neighbor-totoro-1988-editorial-c1-v1',ar:'جاري توتورو',en:'My Neighbor Totoro',year:'1988',artwork:'my-neighbor-totoro-1988.webp',wikipedia:'https://en.wikipedia.org/w/index.php?title=My_Neighbor_Totoro&oldid=1368891540',kim:'https://kids-in-mind.com/m/my-neighbor-totoro-parents-guide-movie-review-rating.htm',queries:['جاري توتورو','My Neighbor Totoro','Totoro','My Neighbour Totoro']},
          ];
          const report = { browser: await browser.version(), baseURL, pages: [], search: [], catalog: null, sitemap: null, failures: [] };
          const hard = (cond,msg) => { if (!cond) throw new Error(msg); };
          const artworkUrl = url => decodeURIComponent(url || '').includes('/artwork/');

          async function inspect(t, viewport, mode) {
            const context = await browser.newContext({ viewport, locale:'ar-EG' });
            const page = await context.newPage();
            await page.addInitScript(() => {
              window.__qaCLS = 0;
              new PerformanceObserver(list => { for (const e of list.getEntries()) if (!e.hadRecentInput) window.__qaCLS += e.value; }).observe({type:'layout-shift',buffered:true});
            });
            const failedRequests=[];
            page.on('requestfailed',req=>failedRequests.push({url:req.url(),error:req.failure()?.errorText||'failed'}));
            const route=`/review?editorialId=${encodeURIComponent(t.editorialId)}`;
            const response=await page.goto(baseURL+route,{waitUntil:'networkidle'});
            hard(response?.ok(),`${mode}-${t.slug}: HTTP ${response?.status()}`);
            await page.waitForTimeout(350);
            const data=await page.evaluate(() => {
              const imgs=[...document.images];
              const artwork=imgs.filter(img=>decodeURIComponent(img.currentSrc||img.src).includes('/artwork/')).map(img=>({src:img.currentSrc||img.src,alt:img.alt,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,objectFit:getComputedStyle(img).objectFit}));
              const ld=[...document.querySelectorAll('script[type="application/ld+json"]')].map(s=>{try{return JSON.parse(s.textContent||'{}')}catch{return null}}).filter(Boolean);
              return {title:document.title,body:document.body.innerText,dir:document.documentElement.dir,scrollWidth:document.documentElement.scrollWidth,innerWidth,brokenImages:imgs.filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.currentSrc||img.src),artwork,canonical:document.querySelector('link[rel="canonical"]')?.href||null,description:document.querySelector('meta[name="description"]')?.content||null,robots:document.querySelector('meta[name="robots"]')?.content||null,ld,disclosure:document.body.innerText.includes('غلاف توضيحي أصلي — ليس الملصق الرسمي'),cls:window.__qaCLS||0};
            });
            hard(data.dir==='rtl',`${mode}-${t.slug}: dir=${data.dir}`);
            hard(data.scrollWidth<=data.innerWidth+1,`${mode}-${t.slug}: horizontal overflow`);
            hard(data.brokenImages.length===0,`${mode}-${t.slug}: broken images ${JSON.stringify(data.brokenImages)}`);
            hard(!failedRequests.some(x=>artworkUrl(x.url)),`${mode}-${t.slug}: failed artwork request`);
            hard(data.cls<=0.01,`${mode}-${t.slug}: CLS ${data.cls}`);
            for (const text of [t.ar,t.en,t.year,'الخلاصة التحريرية','الوقائع المدعومة','المراجع والعزو','Wikipedia (English)','Kids-In-Mind','CC BY-SA 4.0','ربط للمصدر ومرجع وقائع فقط']) hard(data.body.includes(text),`${mode}-${t.slug}: missing ${text}`);
            hard(data.disclosure,`${mode}-${t.slug}: missing artwork disclosure`);
            hard(data.artwork.length===1,`${mode}-${t.slug}: artwork count ${data.artwork.length}`);
            hard(decodeURIComponent(data.artwork[0].src).includes(t.artwork),`${mode}-${t.slug}: wrong artwork`);
            hard(data.artwork[0].naturalWidth>0&&data.artwork[0].naturalHeight>0,`${mode}-${t.slug}: artwork not loaded`);
            hard(data.artwork[0].objectFit==='cover',`${mode}-${t.slug}: object-fit ${data.artwork[0].objectFit}`);
            hard(data.artwork[0].alt.trim().length>0,`${mode}-${t.slug}: empty alt`);
            hard(data.canonical?.includes(`/review?editorialId=${t.editorialId}`),`${mode}-${t.slug}: canonical ${data.canonical}`);
            const article=data.ld.find(x=>x?.['@type']==='Article');
            hard(article,`${mode}-${t.slug}: missing Article JSON-LD`);
            hard(String(article.headline).includes(t.ar)&&String(article.headline).includes(t.en)&&String(article.headline).includes(t.year),`${mode}-${t.slug}: bad Article headline`);
            hard(Array.isArray(article.citation)&&article.citation.includes(t.wikipedia)&&article.citation.includes(t.kim),`${mode}-${t.slug}: bad citations`);
            hard(data.title.includes(t.ar)&&data.title.includes(t.en)&&data.title.includes(t.year),`${mode}-${t.slug}: bad metadata title`);
            if(t.slug==='jurassic'){
              hard(data.body.includes('المعلومات غير كافية'),`jurassic: insufficient-data wording missing`);
              hard(data.body.includes('الشدة غير موثقة')||data.body.includes('لا يحتوي شدة رقمية موثقة'),`jurassic: severity blocker missing`);
              hard(!/شدة\s*[=:]\s*[0-9]/u.test(data.body),`jurassic: invented numeric severity visible`);
            }
            if(t.slug==='totoro') hard(data.body.includes('دبلجة')&&data.body.includes('لا نعمم'),`totoro: dub/version caution missing`);
            if(t.slug==='barbie') hard(data.body.includes('الإسناد:'),`barbie: direct claim attribution missing`);

            await page.screenshot({path:`qa-artifacts/screenshots/${mode}-${t.slug}.png`,fullPage:true});
            const opener=page.getByRole('button',{name:/اقرأ التحليل كاملًا/});
            await opener.click();
            const dialog=page.locator('dialog.editorial-summary-dialog');
            hard(await dialog.evaluate(el=>el.open),`${mode}-${t.slug}: dialog did not open`);
            hard(await dialog.getAttribute('aria-labelledby')==='editorial-summary-dialog-title',`${mode}-${t.slug}: aria-labelledby`);
            hard(await dialog.getAttribute('aria-describedby')==='editorial-summary-dialog-description',`${mode}-${t.slug}: aria-describedby`);
            await page.screenshot({path:`qa-artifacts/screenshots/${mode}-${t.slug}-dialog.png`,fullPage:true});
            const focusChecks=[];
            for(let i=0;i<10;i++){await page.keyboard.press('Tab');focusChecks.push(await dialog.evaluate(el=>el.contains(document.activeElement)));}
            const focusTrapPassed=focusChecks.every(Boolean);
            if(!focusTrapPassed) report.failures.push(`${mode}-${t.slug}: focus escaped modal ${JSON.stringify(focusChecks)}`);
            await page.keyboard.press('Escape');await page.waitForTimeout(100);
            const escapeClosed=!(await dialog.evaluate(el=>el.open));
            const focusReturned=await opener.evaluate(el=>document.activeElement===el);
            if(!escapeClosed) report.failures.push(`${mode}-${t.slug}: Escape did not close dialog`);
            if(!focusReturned) report.failures.push(`${mode}-${t.slug}: focus not restored after Escape`);
            await opener.click();await page.getByRole('button',{name:'إغلاق التحليل'}).click();await page.waitForTimeout(100);
            const buttonFocusReturned=await opener.evaluate(el=>document.activeElement===el);
            if(!buttonFocusReturned) report.failures.push(`${mode}-${t.slug}: focus not restored after close button`);
            report.pages.push({slug:t.slug,mode,viewport,cls:data.cls,scrollWidth:data.scrollWidth,innerWidth:data.innerWidth,brokenImages:data.brokenImages,artwork:data.artwork,canonical:data.canonical,metadataTitle:data.title,description:data.description,robots:data.robots,failedRequests,focusChecks,focusTrapPassed,escapeClosed,focusReturned,buttonFocusReturned});
            await context.close();
          }

          for(const t of titles){await inspect(t,desktop,'desktop');await inspect(t,mobile,'mobile');}

          const context=await browser.newContext();
          const filter=await context.request.get(baseURL+'/titles?editorialStatus=editorial');
          hard(filter.ok(),`filter HTTP ${filter.status()}`);
          const html=await filter.text();
          const qids=[...new Set([...html.matchAll(/href="\/title\/(Q\d+)"/g)].map(m=>m[1]))].sort();
          const expected=['Q102438','Q11621','Q13619743','Q167726','Q182153','Q39571','Q55436290'].sort();
          hard(JSON.stringify(qids)===JSON.stringify(expected),`editorial filter mismatch ${JSON.stringify(qids)}`);
          report.catalog={qids,count:qids.length};
          const sitemapRes=await context.request.get(baseURL+'/sitemap.xml');
          hard(sitemapRes.ok(),`sitemap HTTP ${sitemapRes.status()}`);
          const sitemap=await sitemapRes.text();
          for(const t of titles){hard(sitemap.includes(`/title/${t.qid}`),`sitemap missing ${t.qid}`);hard(sitemap.includes(`editorialId=${t.editorialId}`),`sitemap missing ${t.editorialId}`);}
          report.sitemap={ok:true,length:sitemap.length};
          for(const t of titles){for(const query of t.queries){const res=await context.request.get(baseURL+'/api/search-suggestions?q='+encodeURIComponent(query));const text=await res.text();report.search.push({slug:t.slug,query,status:res.status(),containsQid:text.includes(t.qid),sample:text.slice(0,1200)});}}
          await context.close();
          await fs.writeFile('qa-artifacts/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({browser:report.browser,pages:report.pages,catalog:report.catalog,search:report.search.map(x=>({slug:x.slug,query:x.query,status:x.status,containsQid:x.containsQid})),failures:report.failures},null,2));
          await browser.close();
          if(report.failures.length) throw new Error(`QA failures: ${report.failures.join(' | ')}`);
          NODE
          node .qa-c1-production.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-three-production-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
