name: P4 integration browser QA temporary

on:
  push:
    branches: [agent/p4-integration-rehearsal-2026-08-18]
  pull_request:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install and prepare isolated D1
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > .qa-wrangler.jsonc <<'JSON'
          {
            "name":"qabl-p4-integration-qa",
            "main":"worker/index.ts",
            "compatibility_date":"2026-05-22",
            "compatibility_flags":["nodejs_compat"],
            "d1_databases":[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}]
          }
          JSON
          rm -rf .wrangler/state .wrangler/registry
          for migration in drizzle/*.sql; do
            npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file="$migration" >/dev/null
          done
          node --input-type=module <<'NODE' > /tmp/integration-seed.sql
          import { createHash } from 'node:crypto';
          import { loadEditorialBootstrapFixtures } from './scripts/editorial-bootstrap-sql.mjs';
          const fixtures = await loadEditorialBootstrapFixtures();
          if (fixtures.length !== 10) throw new Error(`Expected exactly 10 fixtures, found ${fixtures.length}`);
          const q = value => `'${String(value).replaceAll("'", "''")}'`;
          for (const { review, presentation } of fixtures) {
            const qid = review.titleId.replace(/^wd:/u, '');
            const aliases = review.titleId === 'wd:Q102438' ? ["Harry Potter and the Sorcerer's Stone"] : [];
            console.log(`INSERT INTO titles (id,canonical_name,original_name,kind,release_year,search_aliases_json) VALUES (${q(review.titleId)},${q(presentation.titleAr)},${q(presentation.titleEn)},${q(review.kind)},${review.releaseYear},${q(JSON.stringify(aliases))});`);
            const hash = createHash('sha256').update(`integration-qa:${qid}`).digest('hex');
            console.log(`INSERT INTO title_catalog_sources (id,title_id,policy_snapshot_id,source_entity_id,source_url,retrieved_at,content_sha256,ingestion_mode) VALUES (${q(`qa-catalog-${qid}`)},${q(review.titleId)},'source-policy:wikidata:2026-08-13.1:catalog_metadata',${q(qid)},${q(`https://www.wikidata.org/wiki/${qid}`)},'2026-08-18T00:00:00Z',${q(hash)},'manual');`);
          }
          NODE
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/integration-seed.sql >/dev/null
          node scripts/editorial-bootstrap-sql.mjs --out /tmp/editorial-bootstrap.sql
          npx wrangler d1 execute site-creator-d1 --local --config=.qa-wrangler.jsonc --file=/tmp/editorial-bootstrap.sql >/dev/null
      - name: Start isolated preview
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/.qa-wrangler.jsonc
        run: |
          (npm run dev:local -- --host 127.0.0.1 --port 4173 >/tmp/p4-integration-server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/p4-integration-server.log
          exit 1
      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Run combined Chrome QA
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'NODE'
          import { chromium } from 'playwright-core';

          const baseURL = 'http://127.0.0.1:4173';
          const publicOrigin = 'https://qabl-almushahada.buildtools.workers.dev';
          const storageKey = 'qabl-almushahada.family-settings.v1';
          const etId = 'et-1982-editorial-batch-v1';
          const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
          const report = { browser: await browser.version(), home: {}, search: {}, normalStorage: {}, blockedStorage: {}, reportHoneypot: {}, failures: [] };
          const hard = (condition, message) => { if (!condition) throw new Error(message); };
          const canonical = async (page) => page.locator('link[rel="canonical"]').getAttribute('href');
          const noOverflow = async (page, label) => {
            const values = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, innerWidth }));
            hard(values.scrollWidth <= values.innerWidth + 1, `${label}: horizontal overflow ${values.scrollWidth}/${values.innerWidth}`);
          };

          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG', reducedMotion: 'reduce' });
            const page = await context.newPage();
            const response = await page.goto(`${baseURL}/`, { waitUntil: 'networkidle' });
            hard(response?.ok(), `home HTTP ${response?.status()}`);
            hard(await canonical(page) === `${publicOrigin}/`, `home canonical=${await canonical(page)}`);
            const body = await page.locator('body').innerText();
            hard(body.includes('دليل عربي يساعدك على اتخاذ قرار قبل المشاهدة'), 'latest practical homepage copy missing');
            hard(!body.includes('ينفع للمشاهدة'), 'colloquial practical copy leaked on home');
            await noOverflow(page, 'home-mobile');
            await page.keyboard.press('Tab');
            const skip = page.locator('.skip-link');
            hard(await skip.evaluate((el) => document.activeElement === el), 'skip link is not first keyboard target');
            const skipStyle = await skip.evaluate((el) => ({ outline: getComputedStyle(el).outline, shadow: getComputedStyle(el).boxShadow }));
            hard(skipStyle.outline.includes('rgb(255, 255, 255)'), `skip inner focus missing: ${skipStyle.outline}`);
            hard(skipStyle.shadow.includes('rgb(122, 45, 23)'), `skip outer focus missing: ${skipStyle.shadow}`);
            hard(await page.evaluate(() => matchMedia('(prefers-reduced-motion: reduce)').matches), 'reduced motion not active');
            report.home = { http: response.status(), canonical: await canonical(page), mobileOverflow: false, skipLink: true, reducedMotion: true };
            await context.close();
          }

          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG' });
            const page = await context.newPage();
            const response = await page.goto(`${baseURL}/search?q=barbie&kind=movie&age=8`, { waitUntil: 'networkidle' });
            hard(response?.ok(), `search HTTP ${response?.status()}`);
            hard(await canonical(page) === `${publicOrigin}/search`, `search canonical=${await canonical(page)}`);
            const robots = await page.locator('meta[name="robots"]').getAttribute('content');
            hard(Boolean(robots?.includes('noindex')), `search noindex missing: ${robots}`);
            const input = page.getByLabel('اسم الفيلم أو المسلسل', { exact: true });
            await input.focus();
            const style = await input.evaluate((el) => ({ outline: getComputedStyle(el).outline, shadow: getComputedStyle(el).boxShadow }));
            hard(style.outline.includes('rgb(255, 255, 255)'), `search focus inner missing: ${style.outline}`);
            hard(style.shadow.includes('rgb(122, 45, 23)'), `search focus outer missing: ${style.shadow}`);
            await noOverflow(page, 'search-mobile');
            report.search = { http: response.status(), canonical: await canonical(page), noindex: true, dualToneFocus: true, mobileOverflow: false };
            await context.close();
          }

          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG' });
            const page = await context.newPage();
            await page.addInitScript((key) => localStorage.removeItem(key), storageKey);
            const response = await page.goto(`${baseURL}/review?editorialId=${encodeURIComponent(etId)}`, { waitUntil: 'networkidle' });
            hard(response?.ok(), `E.T. HTTP ${response?.status()}`);
            let body = await page.locator('body').innerText();
            hard(body.includes('حدد عمر الطفل لإصدار الحكم'), 'E.T. no-settings verdict missing');
            hard(!body.includes('ينفع للمشاهدة'), 'colloquial practical copy leaked on review');
            await page.getByLabel('عمر الطفل', { exact: true }).selectOption('8');
            await page.getByLabel('حد الخوف', { exact: true }).selectOption('1');
            const bullying = page.getByRole('checkbox', { name: /تجنب التنمر بالكامل/u });
            if (await bullying.isChecked()) await bullying.uncheck();
            await page.getByRole('button', { name: /احفظ وحدث الحكم/u }).click();
            await page.waitForTimeout(100);
            body = await page.locator('body').innerText();
            hard(body.includes('لا أنصح به وفق حدود أسرتك'), 'E.T. age-8 practical verdict missing');
            hard(Boolean(await page.evaluate((key) => localStorage.getItem(key), storageKey)), 'family settings not persisted locally');
            await noOverflow(page, 'review-normal-storage-mobile');
            report.normalStorage = { familyProfileRequired: true, verdictUpdated: true, localSaved: true, mobileOverflow: false };
            await context.close();
          }

          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG' });
            const page = await context.newPage();
            await page.addInitScript(() => {
              Object.defineProperty(window, 'localStorage', {
                configurable: true,
                get() { throw new DOMException('Blocked for integration QA', 'SecurityError'); },
              });
            });
            const response = await page.goto(`${baseURL}/review?editorialId=${encodeURIComponent(etId)}`, { waitUntil: 'networkidle' });
            hard(response?.ok(), `blocked-storage E.T. HTTP ${response?.status()}`);
            let body = await page.locator('body').innerText();
            hard(body.includes('التخزين المحلي غير متاح حاليًا'), 'session fallback disclosure missing');
            await page.getByLabel('عمر الطفل', { exact: true }).selectOption('8');
            await page.getByLabel('حد الخوف', { exact: true }).selectOption('1');
            const bullying = page.getByRole('checkbox', { name: /تجنب التنمر بالكامل/u });
            if (await bullying.isChecked()) await bullying.uncheck();
            await page.getByRole('button', { name: /احفظ وحدث الحكم/u }).click();
            await page.waitForTimeout(100);
            body = await page.locator('body').innerText();
            hard(body.includes('لهذه الجلسة فقط'), 'session-only save notice missing');
            hard(body.includes('لا أنصح به وفق حدود أسرتك'), 'session fallback did not update verdict');
            await noOverflow(page, 'review-blocked-storage-mobile');
            report.blockedStorage = { disclosure: true, sessionOnly: true, verdictUpdated: true, mobileOverflow: false };
            await context.close();
          }

          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ar-EG' });
            const page = await context.newPage();
            await page.goto(`${baseURL}/`, { waitUntil: 'networkidle' });
            const result = await page.evaluate(async ({ etId }) => {
              const response = await fetch('/api/reports', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  targetKind: 'editorial_publication',
                  targetId: etId,
                  reason: 'missing_content',
                  message: 'يوجد مشهد مهم غير مذكور في التحليل ويحتاج إلى مراجعة المصدر.',
                  website: 'https://spam.invalid',
                }),
              });
              return { status: response.status, json: await response.json() };
            }, { etId });
            hard(result.status === 202, `honeypot status ${result.status}`);
            hard(result.json?.accepted === true, 'honeypot outward success missing');
            hard(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu.test(result.json?.referenceId ?? ''), `honeypot reference is not UUID: ${result.json?.referenceId}`);
            report.reportHoneypot = { status: result.status, accepted: true, uuidReference: true };
            await context.close();
          }

          const robotsResponse = await fetch(`${baseURL}/robots.txt`);
          const robotsText = await robotsResponse.text();
          hard(robotsResponse.ok, `robots HTTP ${robotsResponse.status}`);
          hard(robotsText.includes('Disallow: /api/'), 'robots /api/ guard missing');
          hard(robotsText.includes('Disallow: /internal'), 'robots /internal guard missing');

          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          NODE
