name: P4-03C2 artwork generate

on:
  push:
    branches:
      - agent/p4-03c2-three-more-editorials

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[artwork-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p4-03c2-three-more-editorials
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate three original local covers
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import os, random
          W,H=720,960
          out='public/artwork'
          os.makedirs(out,exist_ok=True)
          def texture(img,seed):
              rnd=random.Random(seed); ov=Image.new('RGBA',img.size,(0,0,0,0)); d=ImageDraw.Draw(ov)
              for _ in range(2200):
                  x=rnd.randrange(W); y=rnd.randrange(H); a=rnd.randrange(4,14)
                  c=(255,255,255,a) if rnd.random()<.5 else (0,0,0,a//2)
                  d.ellipse((x,y,x+1,y+1),fill=c)
              return Image.alpha_composite(img.convert('RGBA'),ov).convert('RGB')
          # Spider-Man: No Way Home — generic multiverse city, no characters/logos/IP symbols.
          img=Image.new('RGB',(W,H),'#eee7d6'); d=ImageDraw.Draw(img); d.rectangle([0,0,W,650],fill='#183238'); d.rectangle([0,560,W,960],fill='#d7c7a7')
          for bbox,color,width in [((120,90,600,570),'#c76549',38),((165,135,555,525),'#e0a06f',30),((210,180,510,480),'#355b61',26)]:
              d.arc(bbox,190,350,fill=color,width=width); d.arc(bbox,10,170,fill=color,width=width)
          rnd=random.Random(4); x=0
          while x<W:
              bw=rnd.randint(45,90); bh=rnd.randint(90,270); top=590-bh
              d.rectangle([x,top,x+bw,650],fill=rnd.choice(['#263d40','#324b4c','#203438']))
              for wx in range(x+12,x+bw-8,20):
                  for wy in range(top+18,630,28):
                      if rnd.random()<.35: d.rectangle([wx,wy,wx+5,wy+8],fill='#dca76b')
              x+=bw+rnd.randint(5,16)
          d.polygon([(0,710),(200,660),(450,680),(720,630),(720,960),(0,960)],fill='#34483d')
          for pts,col,wid in [([(80,900),(240,720),(360,540)],'#be5a45',22),([(650,900),(510,730),(360,540)],'#527481',22),([(360,930),(360,750),(360,540)],'#d59b5f',18)]: d.line(pts,fill=col,width=wid,joint='curve')
          d.rectangle([0,815,W,845],fill='#1f3431'); texture(img,11).save(f'{out}/spider-man-no-way-home-2021.webp','WEBP',quality=80,method=6)
          # The Hunger Games — generic forest arena, no franchise bird/pin/weapons/logo.
          img=Image.new('RGB',(W,H),'#eee5d2'); d=ImageDraw.Draw(img)
          for r,c in [(170,'#d88155'),(130,'#e9a368'),(90,'#f1c182')]: d.ellipse([W//2-r,100-r//3,W//2+r,100-r//3+2*r],fill=c)
          for layer,(base,col) in enumerate([(590,'#82906b'),(690,'#59694e'),(790,'#31483d')]):
              rnd=random.Random(20+layer)
              for _ in range(18):
                  x=rnd.randint(-30,W+30); h=rnd.randint(180,360); w=rnd.randint(45,100); d.polygon([(x,base-h),(x-w//2,base),(x+w//2,base)],fill=col)
          d.ellipse([90,540,630,940],fill='#c9b58f'); d.ellipse([145,590,575,900],fill='#ded0b0'); d.ellipse([210,655,510,850],fill='#8e9a75')
          for x,y in [(240,730),(360,680),(480,745)]: d.ellipse([x-40,y-12,x+40,y+12],fill='#5a6a5b'); d.rectangle([x-35,y-5,x+35,y+55],fill='#6b7967'); d.ellipse([x-35,y+43,x+35,y+65],fill='#3d5146')
          d.polygon([(320,960),(400,960),(390,835),(330,835)],fill='#d47a50'); texture(img,22).save(f'{out}/the-hunger-games-2012.webp','WEBP',quality=80,method=6)
          # Alice in Wonderland — generic surreal garden/door/checker path, no Disney characters/logos.
          img=Image.new('RGB',(W,H),'#f0e6d2'); d=ImageDraw.Draw(img); d.rectangle([0,0,W,520],fill='#7e9c92'); d.rectangle([0,520,W,960],fill='#e6d5b6')
          d.rounded_rectangle([210,100,510,560],radius=130,fill='#29483f'); d.rounded_rectangle([255,150,465,545],radius=100,fill='#e7a273'); d.rounded_rectangle([295,200,425,535],radius=65,fill='#e9dec4')
          top=535
          for r in range(8):
              y1=top+r*55; y2=y1+55; left=300-r*28; right=420+r*28; mid=(left+right)//2
              a='#45594e' if r%2==0 else '#c66d52'; b='#c66d52' if r%2==0 else '#45594e'
              d.polygon([(left,y1),(mid,y1),(mid+18,y2),(left-10,y2)],fill=a); d.polygon([(mid,y1),(right,y1),(right+10,y2),(mid+18,y2)],fill=b)
          for cx,cy,s,col in [(120,610,1.0,'#c96f54'),(610,690,.8,'#d89964'),(95,790,.65,'#d49b64')]: d.rectangle([cx-10*s,cy,cx+10*s,cy+90*s],fill='#e9dbc2'); d.ellipse([cx-70*s,cy-35*s,cx+70*s,cy+35*s],fill=col)
          for cx,cy in [(585,250),(115,300),(560,420),(160,170)]: d.rounded_rectangle([cx-25,cy-40,cx+25,cy+40],radius=7,fill='#f1e7d2',outline='#3e5a50',width=4); d.ellipse([cx-6,cy-6,cx+6,cy+6],fill='#d27959')
          texture(img,33).save(f'{out}/alice-in-wonderland-2010.webp','WEBP',quality=80,method=6)
          PY
      - name: Commit generated artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P4-03C2 Artwork Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/artwork/spider-man-no-way-home-2021.webp public/artwork/the-hunger-games-2012.webp public/artwork/alice-in-wonderland-2010.webp
          git diff --cached --quiet && exit 0
          git commit -m "P4-03C2 add original local artwork [artwork-ready]"
          git push origin HEAD:agent/p4-03c2-three-more-editorials
