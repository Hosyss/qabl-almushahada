name: P4 live baseline read-only

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://qabl-almushahada.buildtools.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Capture current production baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$WORKER_URL/" > "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error --location "$WORKER_URL/robots.txt" > "$RUNNER_TEMP/robots.txt"
          curl --fail --silent --show-error --location "$WORKER_URL/sitemap.xml" > "$RUNNER_TEMP/sitemap.xml"
          curl --fail --silent --show-error --location --get --data-urlencode 'q=barbie' --data-urlencode 'kind=movie' "$WORKER_URL/search" > "$RUNNER_TEMP/search.html"
          curl --fail --silent --show-error --location --get --data-urlencode 'editorialStatus=editorial' "$WORKER_URL/titles" > "$RUNNER_TEMP/titles-editorial.html"

          python3 - "$RUNNER_TEMP/home.html" "$RUNNER_TEMP/robots.txt" "$RUNNER_TEMP/sitemap.xml" "$RUNNER_TEMP/search.html" "$RUNNER_TEMP/titles-editorial.html" <<'PY'
          import json, re, sys
          home, robots, sitemap, search, titles = [open(path, encoding='utf-8').read() for path in sys.argv[1:]]
          editorial_ids = set(re.findall(r'editorialId=([A-Za-z0-9._~-]+)', sitemap))
          title_qids = set(re.findall(r'/title/(Q\d+)', titles))
          result = {
              'homepage_latest_editorial_ids': sorted(set(re.findall(r'editorialId=([A-Za-z0-9._~-]+)', home))),
              'sitemap_editorial_count': len(editorial_ids),
              'editorial_directory_title_count': len(title_qids),
              'robots_disallow_internal': 'Disallow: /internal' in robots,
              'robots_disallow_api': 'Disallow: /api/' in robots,
              'search_has_noindex': bool(re.search(r'<meta[^>]+name="robots"[^>]+content="[^"]*noindex', search, re.I)),
              'search_has_canonical': bool(re.search(r'<link[^>]+rel="canonical"', search, re.I)),
              'public_head_has_codex_preview': 'codex-preview' in home.lower(),
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result['sitemap_editorial_count'] != 10:
              raise SystemExit(f"Expected 10 editorial reviews in live sitemap, got {result['sitemap_editorial_count']}")
          if result['editorial_directory_title_count'] != 10:
              raise SystemExit(f"Expected 10 editorial titles in live directory, got {result['editorial_directory_title_count']}")
          if len(result['homepage_latest_editorial_ids']) != 4:
              raise SystemExit(f"Expected 4 latest editorial ids on homepage, got {len(result['homepage_latest_editorial_ids'])}")
          if not result['robots_disallow_internal']:
              raise SystemExit('Live robots.txt no longer blocks /internal')
          PY
