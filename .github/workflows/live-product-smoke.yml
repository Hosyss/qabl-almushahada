name: Live product smoke

on:
  workflow_run:
    workflows:
      - Cloudflare production deploy
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-product-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://qabl-almushahada.buildtools.workers.dev

    steps:
      - name: Verify homepage latest-four real-content contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$WORKER_URL/" > "$RUNNER_TEMP/home.html"
          grep -F 'تحليلات منشورة حديثًا' "$RUNNER_TEMP/home.html" > /dev/null
          grep -F 'تحليل تحريري جزئي — الحكم غير مكتمل' "$RUNNER_TEMP/home.html" > /dev/null
          grep -F 'عرض كل التحليلات' "$RUNNER_TEMP/home.html" > /dev/null
          for id in barbie-2023-editorial-c1-v1 jurassic-park-1993-editorial-c1-v1 my-neighbor-totoro-1988-editorial-c1-v1 et-1982-editorial-batch-v1; do
            grep -F "editorialId=$id" "$RUNNER_TEMP/home.html" > /dev/null
          done
          for hidden in cars-2006-editorial-pilot-v1 harry-potter-philosophers-stone-2001-editorial-batch-v1 minions-2015-editorial-batch-v1; do
            if grep -Fq "editorialId=$hidden" "$RUNNER_TEMP/home.html"; then
              echo "Homepage exceeded the latest-four editorial limit: $hidden" >&2
              exit 1
            fi
          done
          python3 - "$RUNNER_TEMP/home.html" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          ids = set(re.findall(r'editorialId=([A-Za-z0-9._~-]+)', html))
          if len(ids) != 4:
              raise SystemExit(f'Homepage must expose exactly 4 editorial review ids, found {len(ids)}: {sorted(ids)}')
          PY
          if grep -Eq 'href="/review"([ >])' "$RUNNER_TEMP/home.html"; then
            echo 'Homepage contains a locator-less /review CTA.' >&2
            exit 1
          fi
          for forbidden in 'مناسب بمرافقة' 'ثقة مرتفعة' 'تمت مراجعة النسخة'; do
            if grep -Fq "$forbidden" "$RUNNER_TEMP/home.html"; then
              echo "Homepage still contains fake review language: $forbidden" >&2
              exit 1
            fi
          done
          grep -F '"@type":"WebSite"' "$RUNNER_TEMP/home.html" > /dev/null
          grep -F '"@type":"Organization"' "$RUNNER_TEMP/home.html" > /dev/null
          if grep -Fq 'SearchAction' "$RUNNER_TEMP/home.html"; then
            echo 'Homepage unexpectedly exposes SearchAction.' >&2
            exit 1
          fi

      - name: Verify HarryPotter conservative discovery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --get --data-urlencode 'q=HarryPotter' "$WORKER_URL/api/search-suggestions" > "$RUNNER_TEMP/harry-suggestions.json"
          grep -F 'did_you_mean' "$RUNNER_TEMP/harry-suggestions.json" > /dev/null
          grep -F 'هاري بوتر وحجر الفيلسوف' "$RUNNER_TEMP/harry-suggestions.json" > /dev/null
          grep -F "Harry Potter and the Philosopher's Stone" "$RUNNER_TEMP/harry-suggestions.json" > /dev/null
          grep -F '2001' "$RUNNER_TEMP/harry-suggestions.json" > /dev/null
          grep -F '/title/Q102438' "$RUNNER_TEMP/harry-suggestions.json" > /dev/null
          curl --fail --silent --show-error --location --get --data-urlencode 'q=HarryPotter' "$WORKER_URL/search" > "$RUNNER_TEMP/harry-search.html"
          grep -F 'هل تقصد؟' "$RUNNER_TEMP/harry-search.html" > /dev/null
          grep -F '/title/Q102438' "$RUNNER_TEMP/harry-search.html" > /dev/null

      - name: Verify seven editorial paths in Arabic and English
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/visible_text.py" <<'PY'
          from html.parser import HTMLParser
          import sys

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {"script", "style", "template", "noscript"}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {"script", "style", "template", "noscript"} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      text = " ".join(data.split())
                      if text:
                          self.parts.append(text)

          parser = VisibleText()
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              parser.feed(handle.read())
          print("\n".join(parser.parts))
          PY

          cat > "$RUNNER_TEMP/editorials.tsv" <<'EOF'
          cars	سيارات	Cars	Q182153	cars-2006-editorial-pilot-v1
          et	إي تي	E.T. the Extra-Terrestrial	Q11621	et-1982-editorial-batch-v1
          harry	هاري بوتر وحجر الفيلسوف	Harry Potter and the Philosopher's Stone	Q102438	harry-potter-philosophers-stone-2001-editorial-batch-v1
          minions	المينيون	Minions	Q13619743	minions-2015-editorial-batch-v1
          barbie	باربي	Barbie	Q55436290	barbie-2023-editorial-c1-v1
          jurassic	الحديقة الجوارسية	Jurassic Park	Q167726	jurassic-park-1993-editorial-c1-v1
          totoro	جاري توتورو	My Neighbor Totoro	Q39571	my-neighbor-totoro-1988-editorial-c1-v1
          EOF

          while IFS=$'\t' read -r slug ar en qid id; do
            for language in ar en; do
              query="$ar"
              [ "$language" = en ] && query="$en"
              curl --fail --silent --show-error --location --get --data-urlencode "q=$query" "$WORKER_URL/search" > "$RUNNER_TEMP/$slug-$language-search.html"
              grep -F 'تحليل تحريري جزئي' "$RUNNER_TEMP/$slug-$language-search.html" > /dev/null
              grep -F "$id" "$RUNNER_TEMP/$slug-$language-search.html" > /dev/null
              grep -F "/title/$qid" "$RUNNER_TEMP/$slug-$language-search.html" > /dev/null
            done

            curl --fail --silent --show-error --location "$WORKER_URL/title/$qid" > "$RUNNER_TEMP/$slug-title.html"
            grep -F "$id" "$RUNNER_TEMP/$slug-title.html" > /dev/null

            curl --fail --silent --show-error --location --get --data-urlencode "editorialId=$id" "$WORKER_URL/review" > "$RUNNER_TEMP/$slug-review.html"
            python3 "$RUNNER_TEMP/visible_text.py" "$RUNNER_TEMP/$slug-review.html" > "$RUNNER_TEMP/$slug-review.txt"

            grep -F 'المعلومات غير كافية لإصدار حكم نهائي' "$RUNNER_TEMP/$slug-review.txt" > /dev/null
            grep -F 'اقرأ التحليل كاملًا' "$RUNNER_TEMP/$slug-review.txt" > /dev/null
            grep -F 'الخلاصة التحريرية' "$RUNNER_TEMP/$slug-review.txt" > /dev/null
            grep -F 'محاور لم نستطع حسمها' "$RUNNER_TEMP/$slug-review.txt" > /dev/null
            grep -F 'مدعومة بمصدرين مستقلين على الأقل' "$RUNNER_TEMP/$slug-review.txt" > /dev/null || grep -F 'مدعومة بمرجع واحد' "$RUNNER_TEMP/$slug-review.txt" > /dev/null

            grep -F 'application/ld+json' "$RUNNER_TEMP/$slug-review.html" > /dev/null
            grep -F 'rel="canonical"' "$RUNNER_TEMP/$slug-review.html" > /dev/null

            for forbidden in 'decisionEligible' 'insufficient_data' 'P4-03' 'مؤهل' 'اتفاق مصدرين مستقلين+'; do
              if grep -Fq "$forbidden" "$RUNNER_TEMP/$slug-review.txt"; then
                echo "$slug exposes forbidden visible term: $forbidden" >&2
                exit 1
              fi
            done
          done < "$RUNNER_TEMP/editorials.tsv"

      - name: Verify title directory pagination and exactly seven editorial titles
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$WORKER_URL/titles" > "$RUNNER_TEMP/titles.html"
          grep -F 'دليل الأفلام والمسلسلات' "$RUNNER_TEMP/titles.html" > /dev/null
          grep -F 'المراجعة الموثقة' "$RUNNER_TEMP/titles.html" > /dev/null
          grep -F 'التالي' "$RUNNER_TEMP/titles.html" > /dev/null
          curl --fail --silent --show-error --location --get --data-urlencode 'q=Harry Potter' --data-urlencode 'kind=movie' --data-urlencode 'year=2001' "$WORKER_URL/titles" > "$RUNNER_TEMP/titles-filtered.html"
          grep -F '2001' "$RUNNER_TEMP/titles-filtered.html" > /dev/null
          grep -F 'Harry Potter' "$RUNNER_TEMP/titles-filtered.html" > /dev/null

          curl --fail --silent --show-error --location --get --data-urlencode 'editorialStatus=editorial' "$WORKER_URL/titles" > "$RUNNER_TEMP/titles-editorial.html"
          python3 - "$RUNNER_TEMP/titles-editorial.html" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actual = set(re.findall(r'href="/title/(Q\d+)"', html))
          expected = {'Q182153','Q11621','Q102438','Q13619743','Q55436290','Q167726','Q39571'}
          if actual != expected:
              raise SystemExit(f'Editorial directory mismatch. expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Verify invalid and mixed review locators fail closed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$WORKER_URL/review" > "$RUNNER_TEMP/invalid-review.html"
          grep -F 'المراجعة غير متاحة حاليًا' "$RUNNER_TEMP/invalid-review.html" > /dev/null
          grep -F 'noindex' "$RUNNER_TEMP/invalid-review.html" > /dev/null
          grep -F '/search' "$RUNNER_TEMP/invalid-review.html" > /dev/null
          for id in cars-2006-editorial-pilot-v1 et-1982-editorial-batch-v1 harry-potter-philosophers-stone-2001-editorial-batch-v1 minions-2015-editorial-batch-v1 barbie-2023-editorial-c1-v1 jurassic-park-1993-editorial-c1-v1 my-neighbor-totoro-1988-editorial-c1-v1; do
            curl --fail --silent --show-error --location --get --data-urlencode "editorialId=$id" --data-urlencode 'publicationId=invalid-publication' "$WORKER_URL/review" > "$RUNNER_TEMP/mixed.html"
            grep -F 'المراجعة غير متاحة حاليًا' "$RUNNER_TEMP/mixed.html" > /dev/null
          done

      - name: Verify indexable sitemap contract for seven rich publications
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$WORKER_URL/sitemap.xml" > "$RUNNER_TEMP/sitemap.xml"
          for id in cars-2006-editorial-pilot-v1 et-1982-editorial-batch-v1 harry-potter-philosophers-stone-2001-editorial-batch-v1 minions-2015-editorial-batch-v1 barbie-2023-editorial-c1-v1 jurassic-park-1993-editorial-c1-v1 my-neighbor-totoro-1988-editorial-c1-v1; do
            grep -F "editorialId=$id" "$RUNNER_TEMP/sitemap.xml" > /dev/null
          done
          for qid in Q182153 Q11621 Q102438 Q13619743 Q55436290 Q167726 Q39571; do
            grep -F "/title/$qid" "$RUNNER_TEMP/sitemap.xml" > /dev/null
          done

      - name: Record live product smoke
        shell: bash
        run: |
          echo '### Live product smoke succeeded' >> "$GITHUB_STEP_SUMMARY"
          echo '- Homepage exposes exactly the latest four real partial editorial analyses plus the all-analyses link' >> "$GITHUB_STEP_SUMMARY"
          echo '- HarryPotter stays conservative and leads to the correct bilingual 2001 title through did-you-mean' >> "$GITHUB_STEP_SUMMARY"
          echo '- All seven titles pass Arabic and English search -> title -> editorial analysis with safe visible presentation' >> "$GITHUB_STEP_SUMMARY"
          echo '- /titles editorial filter exposes exactly seven current-head titles' >> "$GITHUB_STEP_SUMMARY"
          echo '- Invalid/mixed review locators fail closed and sitemap contains all seven rich title/review routes' >> "$GITHUB_STEP_SUMMARY"
